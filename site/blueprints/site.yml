title: Site

tabs:

  # ──────────────────────────────────────────────
  #  TAB 1 — İçerik  (Dashboard + Content Studio)
  # ──────────────────────────────────────────────
  icerik:
    label:
      tr: İçerik
      en: Content
    icon: edit
    columns:

      main:
        width: 2/3
        sections:

          # — Minimal dashboard summary —
          dashboard_summary:
            type: info
            theme: positive
            headline:
              tr: Son durum
              en: Overview
            text: |
              {{ site.panelArchiveReports }}

          recent_drafts:
            type: pages
            headline:
              tr: Son taslaklar
              en: Recent drafts
            create: false
            status: draft
            search: true
            limit: 5
            layout: table
            image: false
            empty:
              tr: Yayına hazır taslak yok.
              en: No drafts pending.
            columns:
              title:
                label:
                  tr: Başlık
                  en: Title
              intendedTemplate:
                label:
                  tr: Tür
                  en: Type
              modified:
                label:
                  tr: Güncelleme
                  en: Updated
                display: d.m.Y H:i

          # — Content sections per type —

          content_type_writing:
            type: pages
            headline:
              tr: Fragmanlar / Yazılar
              en: Fragments / Writing
            parent: site.find('fragmanlar')
            status: all
            search: true
            limit: 10
            layout: table
            create: writing
            templates:
              - writing
            sort: date desc
            empty:
              tr: Henüz yazı yok.
              en: No writing entries yet.
            columns:
              title:
                label:
                  tr: Başlık
                  en: Title
              writing_type:
                label:
                  tr: Tür
                  en: Type
              date:
                label:
                  tr: Tarih
                  en: Date
                display: d.m.Y
              status:
                label:
                  tr: Durum
                  en: Status

          content_type_film_review:
            type: pages
            headline:
              tr: Perde / Film kayıtları
              en: Screen / Film notes
            parent: site.find('perde')
            status: all
            search: true
            limit: 10
            layout: table
            create: film-review
            templates:
              - film-review
            sort: date desc
            empty:
              tr: Henüz film kaydı yok.
              en: No film entries yet.
            columns:
              title:
                label:
                  tr: Başlık
                  en: Title
              rating:
                label:
                  tr: Puan
                  en: Rating
              date:
                label:
                  tr: Tarih
                  en: Date
                display: d.m.Y
              status:
                label:
                  tr: Durum
                  en: Status

          content_type_book_review:
            type: pages
            headline:
              tr: Marginalia / Kitap kayıtları
              en: Marginalia / Book notes
            parent: site.find('marginalia')
            status: all
            search: true
            limit: 10
            layout: cards
            create: book-review
            templates:
              - book-review
            sort: date desc
            empty:
              tr: Henüz kitap kaydı yok.
              en: No book entries yet.
            image:
              query: page.cover.toFile
              ratio: 2/3
              cover: true

          content_type_photo_album:
            type: pages
            headline:
              tr: Kadraj / Fotoğraf albümleri
              en: Frame / Photo albums
            parent: site.find('kadraj')
            status: all
            search: true
            limit: 8
            layout: cards
            create: photo-album
            templates:
              - photo-album
            sort: date desc
            empty:
              tr: Henüz fotoğraf albümü yok.
              en: No photo albums yet.
            image:
              query: page.cover.toFile
              ratio: 4/3
              cover: true

      sidebar:
        width: 1/3
        sections:

          quick_links:
            type: info
            theme: passive
            headline:
              tr: Hızlı bağlantılar
              en: Quick links
            text:
              tr: |
                - [Ana Sayfa](/panel/pages/home)
                - [Error](/panel/pages/error)
                - [Etiketler](/panel/pages/tags)
                - [Görünüm](/panel/site?tab=gorunum)
                - [Sistem](/panel/site?tab=sistem)
              en: |
                - [Home](/panel/pages/home)
                - [Error](/panel/pages/error)
                - [Tags](/panel/pages/tags)
                - [Appearance](/panel/site?tab=gorunum)
                - [System](/panel/site?tab=sistem)

          content_map:
            type: info
            theme: positive
            headline:
              tr: İçerik haritası
              en: Content map
            text:
              tr: |
                Yazı → Fragmanlar
                Kitap → Marginalia
                Film → Perde
                Playlist → Rezonans
                Fotoğraf → Kadraj
                Sanat → Exhibit
              en: |
                Writing → Fragments
                Books → Marginalia
                Film → Screen
                Playlists → Resonance
                Photo → Frame
                Art → Exhibit

          content_type_playlist:
            type: pages
            headline:
              tr: Rezonans / Playlistler
              en: Resonance / Playlists
            parent: site.find('rezonans')
            status: all
            search: true
            limit: 6
            layout: cards
            create: playlist
            templates:
              - playlist
            sort: date desc
            empty:
              tr: Henüz playlist yok.
              en: No playlists yet.
            image:
              query: page.cover.toFile
              ratio: 1/1
              cover: true

          content_type_art_project:
            type: pages
            headline:
              tr: Exhibit / Sanat kayıtları
              en: Exhibit / Art records
            parent: site.find('exhibit')
            status: all
            search: true
            limit: 6
            layout: cards
            create: art-project
            templates:
              - art-project
            sort: date desc
            empty:
              tr: Henüz exhibit kaydı yok.
              en: No exhibit entries yet.
            image:
              query: page.cover.toFile
              ratio: 4/3
              cover: true

          all_pages:
            type: pages
            headline:
              tr: Tüm sayfalar
              en: All pages
            status: all
            create: false
            search: true
            limit: 20
            layout: table
            image: false
            columns:
              title:
                label:
                  tr: Başlık
                  en: Title
              status:
                label:
                  tr: Durum
                  en: Status

  # ──────────────────────────────────────────────
  #  TAB 2 — Görünüm  (Identity + Design + SEO)
  # ──────────────────────────────────────────────
  gorunum:
    label:
      tr: Görünüm
      en: Appearance
    icon: palette
    columns:

      main:
        width: 2/3
        sections:

          # ── Kimlik ──
          identity_fields:
            type: fields
            headline:
              tr: Kimlik
              en: Identity
            fields:
              site_title:
                label:
                  tr: Site başlığı
                  en: Site title
                type: text
              site_subtitle:
                label:
                  tr: Site alt başlığı
                  en: Site subtitle
                type: text
              site_description:
                label:
                  tr: Site açıklaması
                  en: Site description
                type: textarea
                size: small
              site_author:
                label:
                  tr: Site yazarı
                  en: Site author
                type: text

          # ── Navigasyon ──
          navigation_fields:
            type: fields
            headline:
              tr: Navigasyon
              en: Navigation
            fields:
              show_home_link:
                label:
                  tr: Ana sayfa linkini göster
                  en: Show home link
                type: toggle
                default: true
                width: 1/2
              show_about_link:
                label:
                  tr: Hakkımda linkini göster
                  en: Show about link
                type: toggle
                default: false
                width: 1/2
              main_navigation:
                label:
                  tr: Ana navigasyon
                  en: Main navigation
                type: structure
                fields:
                  label:
                    label:
                      tr: Etiket
                      en: Label
                    type: text
                    width: 1/2
                  link:
                    label:
                      tr: İç sayfa
                      en: Internal page
                    type: pages
                    max: 1
                    width: 1/2
                  external_url:
                    label:
                      tr: Dış URL
                      en: External URL
                    type: url
                    width: 1/2
                  open_in_new_tab:
                    label:
                      tr: Yeni sekmede aç
                      en: Open in new tab
                    type: toggle
                    default: false
                    width: 1/2

          # ── Sosyal Kanallar ──
          social_fields:
            type: fields
            headline:
              tr: Sosyal kanallar
              en: Social channels
            fields:
              social_links:
                label:
                  tr: Sosyal linkler
                  en: Social links
                type: structure
                fields:
                  platform:
                    label: Platform
                    type: text
                    width: 1/2
                  label:
                    label:
                      tr: Erişilebilir etiket
                      en: Accessible label
                    type: text
                    width: 1/2
                  url:
                    label: URL
                    type: url
                  icon_name:
                    label:
                      tr: FontAwesome ikon sınıfı
                      en: FontAwesome icon class
                    type: text
                    placeholder: "fab fa-instagram"
                    width: 1/2
                  icon_svg:
                    label:
                      tr: Özel SVG ikon
                      en: Custom SVG icon
                    type: files
                    max: 1
                    width: 1/2
                    uploads:
                      accept: .svg
                  icon_color:
                    label:
                      tr: İkon rengi
                      en: Icon color
                    type: color
                    width: 1/2
                  icon_size:
                    label:
                      tr: İkon boyutu
                      en: Icon size
                    type: number
                    after: px
                    width: 1/2
                  visible:
                    label:
                      tr: Görünür
                      en: Visible
                    type: toggle
                    default: true

          # ── Renkler ──
          color_tokens:
            type: fields
            headline:
              tr: Renkler
              en: Colors
            fields:
              color_background:
                label:
                  tr: Arka plan
                  en: Background
                type: color
                default: "#260c1a"
                width: 1/2
              color_text:
                label:
                  tr: Metin
                  en: Text
                type: color
                default: "#f5e9e2"
                width: 1/2
              color_muted:
                label:
                  tr: Soluk metin
                  en: Muted text
                type: color
                default: "#bca9a8"
                width: 1/2
              color_accent:
                label:
                  tr: Vurgu (altın)
                  en: Accent (gold)
                type: color
                default: "#c9a45c"
                width: 1/2
              color_accent_secondary:
                label:
                  tr: İkincil vurgu (şarap)
                  en: Secondary accent (wine)
                type: color
                default: "#8f2f4a"
                width: 1/2

          # ── Tipografi & Layout ──
          layout_tokens:
            type: fields
            headline:
              tr: Tipografi ve düzen
              en: Typography and layout
            fields:
              header_style:
                label:
                  tr: Header stili
                  en: Header style
                type: select
                width: 1/2
                options:
                  static: Static
                  sticky: Sticky
              enable_soft_hover:
                label:
                  tr: Yumuşak hover efektleri
                  en: Soft hover effects
                type: toggle
                default: true
                width: 1/2
              site_max_width:
                label:
                  tr: Site maks. genişliği
                  en: Site max width
                type: text
                placeholder: "1200px"
                width: 1/2
              content_max_width_ch:
                label:
                  tr: Okuma genişliği
                  en: Reading width
                type: number
                after: ch
                default: 68
                width: 1/2
              section_spacing:
                label:
                  tr: Bölüm boşluğu
                  en: Section spacing
                type: text
                placeholder: "4rem"
                width: 1/2
              card_radius:
                label:
                  tr: Kart köşe yarıçapı
                  en: Card radius
                type: number
                after: px
                default: 0
                width: 1/2
              card_border_opacity:
                label:
                  tr: Kart kenarlık opaklığı
                  en: Card border opacity
                type: number
                step: 0.05
                min: 0
                max: 1
                default: 0.1
                width: 1/2

          # ── SEO Varsayılanları ──
          seo_defaults:
            type: fields
            headline:
              tr: SEO varsayılanları
              en: SEO defaults
            fields:
              default_seo_title:
                label:
                  tr: Varsayılan SEO başlığı
                  en: Default SEO title
                type: text
              default_seo_description:
                label:
                  tr: Varsayılan meta açıklaması
                  en: Default meta description
                type: textarea
                size: small
              default_og_image:
                label:
                  tr: Varsayılan OG görseli
                  en: Default OG image
                type: files
                max: 1
              canonical_base_url:
                label: Canonical base URL
                type: url
                placeholder: "https://example.com"
              twitter_card_type:
                label: Twitter card
                type: select
                default: summary_large_image
                options:
                  summary: Summary
                  summary_large_image: Summary large image

          # ── Footer ──
          footer_fields:
            type: fields
            headline:
              tr: Alt bilgi
              en: Footer
            fields:
              footer_text:
                label:
                  tr: Alt bilgi metni
                  en: Footer text
                type: text
                help:
                  tr: Boş bırakılırsa site alt başlığı kullanılır.
                  en: Falls back to site subtitle when empty.
              copyright_text:
                label:
                  tr: Telif metni
                  en: Copyright text
                type: text
              rss_enabled:
                label:
                  tr: RSS linkini göster
                  en: Show RSS link
                type: toggle
                default: true

      sidebar:
        width: 1/3
        sections:

          # ── Logo ve Görseller ──
          branding_fields:
            type: fields
            headline:
              tr: Logo ve profil
              en: Logo and profile
            fields:
              logo:
                label:
                  tr: Logo
                  en: Logo
                type: files
                max: 1
                uploads:
                  accept: .svg, .png, .jpg, .jpeg
                help:
                  tr: Header'da kullanılır.
                  en: Used in the header.
              profile_image:
                label:
                  tr: Profil görseli
                  en: Profile image
                type: files
                max: 1
              favicon:
                label: Favicon
                type: files
                max: 1
                uploads:
                  accept: .ico, .png, .svg

          # ── Logo Rengi ──
          logo_color_field:
            type: fields
            headline:
              tr: Logo görünümü
              en: Logo appearance
            fields:
              logo_color:
                label:
                  tr: SVG logo rengi
                  en: SVG logo color
                type: color
                default: "#DDD96A"

          seo_health:
            type: info
            theme: notice
            headline:
              tr: SEO durumu
              en: SEO health
            text: |
              {{ site.panelSeoWarnings }}

          media_health:
            type: info
            theme: passive
            headline:
              tr: Medya durumu
              en: Media health
            text: |
              {{ site.panelMediaSummary }}

  # ──────────────────────────────────────────────
  #  TAB 3 — Sistem  (Operations + Media + Cache)
  # ──────────────────────────────────────────────
  sistem:
    label:
      tr: Sistem
      en: System
    icon: settings
    columns:

      main:
        width: 2/3
        sections:

          secret_policy:
            type: info
            theme: info
            headline:
              tr: Gizli anahtar politikası
              en: Secret policy
            text:
              tr: |
                TMDB, Spotify ve GA4 gizli değerleri `.env` üzerinden okunur. Secret değerleri Panel içeriğine veya frontend'e yazılmaz.
              en: |
                TMDB, Spotify and GA4 secrets are read from `.env`. Secret values are not stored in Panel content or exposed to the frontend.

          # ── TMDB ──
          tmdb_config:
            type: fields
            headline: TMDB
            fields:
              tmdb_enabled:
                label:
                  tr: Entegrasyon aktif
                  en: Integration enabled
                type: toggle
                default: true
                width: 1/2
              tmdb_cache_enabled:
                label:
                  tr: Cache aktif
                  en: Cache enabled
                type: toggle
                default: true
                width: 1/2
              tmdb_cache_ttl:
                label: Cache TTL
                type: number
                after: minutes
                placeholder: 10080
                width: 1/2
              tmdb_language:
                label:
                  tr: Dil
                  en: Language
                type: select
                default: tr-TR
                width: 1/2
                options:
                  tr-TR: Türkçe
                  en-US: English
              tmdb_image_size:
                label:
                  tr: Görsel boyutu
                  en: Image size
                type: select
                default: w500
                width: 1/2
                options:
                  w500: Standart
                  original: Original
              tmdb_manual_override_priority:
                label:
                  tr: Manuel alanlar öncelikli
                  en: Manual fields first
                type: toggle
                default: true
                width: 1/2

          # ── Spotify ──
          spotify_status:
            type: info
            theme: info
            headline:
              tr: Spotify bağlantı durumu
              en: Spotify connection
            text: |
              {{ site.spotifyIntegrationStatus }}

          spotify_config:
            type: fields
            headline: Spotify
            fields:
              spotify_enabled:
                label:
                  tr: Entegrasyon aktif
                  en: Integration enabled
                type: toggle
                default: true
                width: 1/2
              spotify_cache_ttl:
                label: Cache TTL
                type: number
                after: minutes
                default: 360
                width: 1/2
              spotify_market:
                label: Market
                type: text
                default: TR
                maxlength: 2
                width: 1/2
                help:
                  tr: ISO ülke kodu. Örnek TR, US.
                  en: ISO country code. Example TR, US.
              spotify_test_connection_requested:
                label:
                  tr: Bağlantıyı test et
                  en: Test connection
                type: toggle
                default: false
                width: 1/2
                help:
                  tr: Açıp kaydedince token testi yapılır.
                  en: Turn on and save to run a token test.
              spotify_last_tested_at:
                label:
                  tr: Son test zamanı
                  en: Last test time
                type: date
                time: true
                disabled: true
                width: 1/2
              spotify_last_error:
                label:
                  tr: Son hata
                  en: Last error
                type: textarea
                size: small
                disabled: true
                width: 1/2

          # ── Medya Optimizasyonu ──
          imagex_info:
            type: info
            theme: info
            headline: ImageX / WebP
            text:
              tr: |
                JPEG, PNG ve WebP görseller ImageX üzerinden işlenir. SVG, GIF ve uzak görseller kendi yapısını korur.
              en: |
                JPEG, PNG and WebP are processed through ImageX. SVG, GIF and remote images keep native markup.

          imagex_defaults:
            type: fields
            headline:
              tr: Optimizasyon varsayılanları
              en: Optimization defaults
            fields:
              image_optimization_enabled:
                label:
                  tr: ImageX optimizasyonu
                  en: ImageX optimization
                type: toggle
                default: true
                width: 1/2
              image_default_loading:
                label:
                  tr: Varsayılan yükleme
                  en: Default loading
                type: select
                default: lazy
                width: 1/2
                options:
                  lazy: Lazy
                  eager:
                    tr: Eager / öncelikli
                    en: Eager / priority
              image_default_srcset:
                label:
                  tr: Varsayılan srcset
                  en: Default srcset
                type: select
                default: default
                width: 1/2
                options:
                  default:
                    tr: Varsayılan içerik
                    en: Default content
                  card:
                    tr: Kartlar
                    en: Cards
                  wide:
                    tr: Geniş
                    en: Wide
                  hero:
                    tr: Hero
                    en: Hero
              image_default_sizes:
                label:
                  tr: Varsayılan sizes
                  en: Default sizes
                type: text
                width: 1/2
                placeholder: "(min-width: 900px) 800px, 100vw"

          # ── Content Transfer ──
          content_transfer_status:
            type: info
            theme: info
            headline:
              tr: İçerik transfer durumu
              en: Content transfer status
            text: |
              {{ site.contentTransferStatus }}

          content_transfer_tools:
            type: fields
            headline:
              tr: İçerik transfer araçları
              en: Content transfer tools
            fields:
              content_transfer_export_requested:
                label:
                  tr: ZIP export oluştur
                  en: Create ZIP export
                type: toggle
                default: false
                width: 1/2
                help:
                  tr: Açıp kaydedince indirilebilir ZIP hazırlanır.
                  en: Turn on and save to create a downloadable ZIP.
              content_transfer_import_requested:
                label:
                  tr: ZIP'i içe aktar
                  en: Import ZIP
                type: toggle
                default: false
                width: 1/2
              content_transfer_import_file:
                label:
                  tr: Import dosyası
                  en: Import file
                type: files
                max: 1
                layout: list
                query: site.files
                uploads:
                  accept: application/zip
                width: 1/2
              content_transfer_overwrite:
                label:
                  tr: Üzerine yaz
                  en: Overwrite
                type: toggle
                default: false
                width: 1/2
              content_transfer_last_export_file:
                label:
                  tr: Son export
                  en: Last export
                type: text
                disabled: true
                width: 1/2
              content_transfer_last_import_at:
                label:
                  tr: Son import zamanı
                  en: Last import time
                type: date
                time: true
                disabled: true
                width: 1/2
              content_transfer_last_status:
                label:
                  tr: Son sonuç
                  en: Last result
                type: textarea
                size: small
                disabled: true

      sidebar:
        width: 1/3
        sections:

          # ── Cache ──
          cache_status:
            type: info
            theme: notice
            headline:
              tr: Cache durumu
              en: Cache status
            text: |
              {{ site.panelCacheSummary }}

          cache_tools:
            type: fields
            headline:
              tr: Cache araçları
              en: Cache tools
            fields:
              cache_clear_requested:
                label:
                  tr: Cache'i temizle
                  en: Clear cache
                type: toggle
                default: false
                help:
                  tr: Açıp kaydedince tüm cache temizlenir.
                  en: Turn on and save to clear all caches.
              cache_last_cleared_at:
                label:
                  tr: Son temizleme
                  en: Last cleared
                type: date
                time: true
                disabled: true
              cache_last_clear_status:
                label:
                  tr: Sonuç
                  en: Result
                type: textarea
                size: small
                disabled: true

          # ── Google Analytics ──
          google_analytics_config:
            type: fields
            headline: Google Analytics
            fields:
              ga_enabled:
                label:
                  tr: GA4 aktif
                  en: GA4 enabled
                type: toggle
                default: false
              ga_force_local:
                label:
                  tr: Local ortamda çalıştır
                  en: Run in local
                type: toggle
                default: false
                help:
                  tr: Production dışında test gerektiğinde açın.
                  en: Enable for non-production testing.
              ga_measurement_id:
                label: Measurement ID
                type: text
                placeholder: G-XXXXXXXXXX
              ga_report_url:
                label:
                  tr: Rapor linki
                  en: Report link
                type: url
              ga_consent_mode:
                label:
                  tr: Consent modu
                  en: Consent mode
                type: select
                default: denied
                options:
                  denied:
                    tr: Varsayılan kapalı
                    en: Denied by default
                  granted:
                    tr: Varsayılan açık
                    en: Granted by default

          # ── Ortam ──
          environment_info:
            type: info
            theme: passive
            headline:
              tr: Ortam
              en: Environment
            text: |
              {{ site.panelEnvironmentSummary }}

          google_analytics_status:
            type: info
            theme: info
            headline:
              tr: Analytics durumu
              en: Analytics status
            text: |
              {{ site.panelGoogleAnalyticsSummary }}

          imagex_profiles:
            type: info
            headline:
              tr: Srcset profilleri
              en: Srcset profiles
            text: |
