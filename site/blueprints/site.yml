title: Site

tabs:
  dashboard:
    label:
      tr: Kontrol
      en: Control
    icon: dashboard
    columns:
      main:
        width: 2/3
        sections:
          dashboard_welcome:
            type: info
            theme: positive
            headline:
              tr: Yayın kontrol merkezi
              en: Publishing control room
            text:
              tr: |
                İçerik üretimi, sayfa yönetimi, SEO, medya sağlığı ve entegrasyon durumları tek yerden izlenir. Günlük editoryal iş için önce İçerik Stüdyosu sekmesini kullanın.
              en: |
                Monitor editorial production, pages, SEO, media health and integrations from one place. Use the Content Studio tab for day-to-day publishing.

          dashboard_stats:
            type: info
            theme: info
            headline:
              tr: Arşiv durumu
              en: Archive status
            text: |
              {{ site.panelArchiveStats }}

          recent_drafts:
            type: pages
            headline:
              tr: Üzerinde çalışılan taslaklar
              en: Drafts in progress
            create: false
            status: draft
            search: true
            limit: 8
            layout: table
            image: false
            empty:
              tr: Yayına hazır taslak bulunamadı.
              en: No drafts waiting for review.
            columns:
              title:
                label:
                  tr: Başlık
                  en: Title
              intendedTemplate:
                label:
                  tr: Tür
                  en: Type
              modified:
                label:
                  tr: Son güncelleme
                  en: Last update
                display: d.m.Y H:i

          editorial_alerts:
            type: info
            theme: notice
            headline:
              tr: Editoryal uyarılar
              en: Editorial alerts
            text: |
              {{ site.panelSeoWarnings }}

      sidebar:
        width: 1/3
        sections:
          quick_actions:
            type: info
            theme: passive
            headline:
              tr: Hızlı aksiyonlar
              en: Quick actions
            text:
              tr: |
                - [İçerik Stüdyosu](/panel/site?tab=content_studio)
                - [Ana Sayfa](/panel/pages/home)
                - [Sayfalar](/panel/site?tab=pages)
                - [Kimlik & Tasarım](/panel/site?tab=appearance)
                - [Operasyonlar](/panel/site?tab=operations)
              en: |
                - [Content Studio](/panel/site?tab=content_studio)
                - [Home Page](/panel/pages/home)
                - [Pages](/panel/site?tab=pages)
                - [Identity & Design](/panel/site?tab=appearance)
                - [Operations](/panel/site?tab=operations)

          media_health:
            type: info
            headline:
              tr: Medya özeti
              en: Media summary
            text: |
              {{ site.panelMediaSummary }}

          environment_info:
            type: info
            headline:
              tr: Ortam
              en: Environment
            text: |
              {{ site.panelEnvironmentSummary }}

          google_analytics:
            type: info
            theme: info
            headline:
              tr: Analytics durumu
              en: Analytics status
            text: |
              {{ site.panelGoogleAnalyticsSummary }}

  content_studio:
    label:
      tr: İçerik Stüdyosu
      en: Content Studio
    icon: edit
    columns:
      main:
        width: 2/3
        sections:
          studio_intro:
            type: info
            theme: info
            headline:
              tr: Üretim masası
              en: Production desk
            text:
              tr: |
                Burada sadece içerik kayıtları üretilir. Ana sayfa, error, site ayarları ve global tasarım Sayfalar veya Kimlik & Tasarım sekmelerinde kalır.
              en: |
                Create editorial entries here. Home, error pages, site settings and global design stay under Pages or Identity & Design.

          content_type_writing:
            type: pages
            headline:
              tr: Fragmanlar / Yazılar
              en: Fragments / Writing
            parent: site.find('fragmanlar')
            status: all
            search: true
            limit: 10
            layout: table
            create: writing
            templates:
              - writing
            sort: date desc
            empty:
              tr: Henüz yazı yok.
              en: No writing entries yet.
            columns:
              title:
                label:
                  tr: Başlık
                  en: Title
              writing_type:
                label:
                  tr: Tür
                  en: Type
              date:
                label:
                  tr: Tarih
                  en: Date
                display: d.m.Y
              status:
                label:
                  tr: Durum
                  en: Status

          content_type_film_review:
            type: pages
            headline:
              tr: Perde / Film kayıtları
              en: Screen / Film notes
            parent: site.find('perde')
            status: all
            search: true
            limit: 10
            layout: table
            create: film-review
            templates:
              - film-review
            sort: date desc
            empty:
              tr: Henüz film kaydı yok.
              en: No film entries yet.
            columns:
              title:
                label:
                  tr: Başlık
                  en: Title
              rating:
                label:
                  tr: Puan
                  en: Rating
              date:
                label:
                  tr: Tarih
                  en: Date
                display: d.m.Y
              status:
                label:
                  tr: Durum
                  en: Status

          content_type_photo_album:
            type: pages
            headline:
              tr: Kadraj / Fotoğraf albümleri
              en: Frame / Photo albums
            parent: site.find('kadraj')
            status: all
            search: true
            limit: 8
            layout: cards
            create: photo-album
            templates:
              - photo-album
            sort: date desc
            empty:
              tr: Henüz fotoğraf albümü yok.
              en: No photo albums yet.
            image:
              query: page.cover.toFile
              ratio: 4/3
              cover: true

      sidebar:
        width: 1/3
        sections:
          content_map:
            type: info
            theme: positive
            headline:
              tr: İçerik haritası
              en: Content map
            text:
              tr: |
                Yazı → Fragmanlar
                Kitap → Marginalia
                Film → Perde
                Playlist → Rezonans
                Fotoğraf → Kadraj
                Sanat → Exhibit
              en: |
                Writing → Fragments
                Books → Marginalia
                Film → Screen
                Playlists → Resonance
                Photo → Frame
                Art → Exhibit

          content_type_book_review:
            type: pages
            headline:
              tr: Marginalia / Kitap kayıtları
              en: Marginalia / Book notes
            parent: site.find('marginalia')
            status: all
            search: true
            limit: 6
            layout: cards
            create: book-review
            templates:
              - book-review
            sort: date desc
            empty:
              tr: Henüz kitap kaydı yok.
              en: No book entries yet.
            image:
              query: page.cover.toFile
              ratio: 2/3
              cover: true

          content_type_playlist:
            type: pages
            headline:
              tr: Rezonans / Playlistler
              en: Resonance / Playlists
            parent: site.find('rezonans')
            status: all
            search: true
            limit: 6
            layout: cards
            create: playlist
            templates:
              - playlist
            sort: date desc
            empty:
              tr: Henüz playlist yok.
              en: No playlists yet.
            image:
              query: page.cover.toFile
              ratio: 1/1
              cover: true

          content_type_art_project:
            type: pages
            headline:
              tr: Exhibit / Sanat kayıtları
              en: Exhibit / Art records
            parent: site.find('exhibit')
            status: all
            search: true
            limit: 6
            layout: cards
            create: art-project
            templates:
              - art-project
            sort: date desc
            empty:
              tr: Henüz exhibit kaydı yok.
              en: No exhibit entries yet.
            image:
              query: page.cover.toFile
              ratio: 4/3
              cover: true

  pages:
    label:
      tr: Sayfalar
      en: Pages
    icon: page
    columns:
      main:
        width: 2/3
        sections:
          pages_intro:
            type: info
            theme: info
            headline:
              tr: Site iskeleti
              en: Site structure
            text:
              tr: |
                Ana sayfa, error, etiket sayfası ve arşiv kapıları burada yönetilir. İçerik kayıtları için İçerik Stüdyosu sekmesini kullanın.
              en: |
                Manage home, error, tags and archive landing pages here. Use Content Studio for editorial records.

          all_pages:
            type: pages
            headline:
              tr: Tüm sayfalar
              en: All pages
            status: all
            create: false
            search: true
            limit: 40
            layout: table
            image: false
            empty:
              tr: Sayfa bulunamadı.
              en: No pages found.
            columns:
              title:
                label:
                  tr: Başlık
                  en: Title
              intendedTemplate:
                label:
                  tr: Şablon
                  en: Template
              status:
                label:
                  tr: Durum
                  en: Status
              modified:
                label:
                  tr: Son güncelleme
                  en: Last update
                display: d.m.Y H:i

      sidebar:
        width: 1/3
        sections:
          page_shortcuts:
            type: info
            theme: positive
            headline:
              tr: Sık kullanılan sayfalar
              en: Frequent pages
            text:
              tr: |
                - [Ana Sayfa](/panel/pages/home)
                - [Error Sayfası](/panel/pages/error)
                - [Tag Sayfası](/panel/pages/tags)
                - [Fragmanlar](/panel/pages/fragmanlar)
                - [Rezonans](/panel/pages/rezonans)
              en: |
                - [Home](/panel/pages/home)
                - [Error Page](/panel/pages/error)
                - [Tags](/panel/pages/tags)
                - [Fragments](/panel/pages/fragmanlar)
                - [Resonance](/panel/pages/rezonans)

          homepage_map:
            type: info
            theme: passive
            headline:
              tr: Ana sayfa modülleri
              en: Home modules
            text:
              tr: |
                Home kaydında hero, marquee, oda kartları, vitrindeki nesne, son kataloglananlar, tag wall ve manifesto şeridi yönetilir.
              en: |
                The Home page controls hero, marquee, room cards, featured object, recent entries, tag wall and manifesto strip.

  appearance:
    label:
      tr: Kimlik & Tasarım
      en: Identity & Design
    icon: palette
    columns:
      main:
        width: 2/3
        sections:
          localized_identity:
            type: fields
            headline:
              tr: İki dilli kimlik
              en: Bilingual identity
            fields:
              site_title_tr:
                label:
                  tr: Site başlığı
                  en: Site title - Turkish
                type: text
                width: 1/2
              site_title_en:
                label:
                  tr: Site başlığı - İngilizce
                  en: Site title
                type: text
                width: 1/2
              site_subtitle_tr:
                label:
                  tr: Site alt başlığı
                  en: Site subtitle - Turkish
                type: text
                width: 1/2
              site_subtitle_en:
                label:
                  tr: Site alt başlığı - İngilizce
                  en: Site subtitle
                type: text
                width: 1/2
              site_description_tr:
                label:
                  tr: Site açıklaması
                  en: Site description - Turkish
                type: textarea
                size: small
                width: 1/2
              site_description_en:
                label:
                  tr: Site açıklaması - İngilizce
                  en: Site description
                type: textarea
                size: small
                width: 1/2
              site_author_tr:
                label:
                  tr: Site yazarı
                  en: Site author - Turkish
                type: text
                width: 1/2
              site_author_en:
                label:
                  tr: Site yazarı - İngilizce
                  en: Site author
                type: text
                width: 1/2

          navigation_fields:
            type: fields
            headline:
              tr: Navigasyon
              en: Navigation
            fields:
              show_home_link:
                label:
                  tr: Ana sayfa linkini göster
                  en: Show home link
                type: toggle
                default: true
                width: 1/2
              show_about_link:
                label:
                  tr: Hakkımda linkini göster
                  en: Show about link
                type: toggle
                default: false
                width: 1/2
              main_navigation:
                label:
                  tr: Ana navigasyon
                  en: Main navigation
                type: structure
                fields:
                  label:
                    label:
                      tr: Varsayılan etiket
                      en: Default label
                    type: text
                    width: 1/2
                  label_tr:
                    label:
                      tr: Etiket - Türkçe
                      en: Label - Turkish
                    type: text
                    width: 1/2
                  label_en:
                    label:
                      tr: Etiket - İngilizce
                      en: Label - English
                    type: text
                    width: 1/2
                  link:
                    label:
                      tr: İç sayfa
                      en: Internal page
                    type: pages
                    max: 1
                    width: 1/2
                  external_url:
                    label:
                      tr: Dış URL
                      en: External URL
                    type: url
                    width: 1/2
                  open_in_new_tab:
                    label:
                      tr: Yeni sekmede aç
                      en: Open in new tab
                    type: toggle
                    default: false
                    width: 1/2

          social_fields:
            type: fields
            headline:
              tr: Sosyal kanallar
              en: Social channels
            fields:
              social_links:
                label:
                  tr: Sosyal linkler
                  en: Social links
                type: structure
                fields:
                  platform:
                    label: Platform
                    type: text
                    width: 1/2
                  label:
                    label:
                      tr: Erişilebilir etiket
                      en: Accessible label
                    type: text
                    width: 1/2
                  label_tr:
                    label:
                      tr: Etiket - Türkçe
                      en: Label - Turkish
                    type: text
                    width: 1/2
                  label_en:
                    label:
                      tr: Etiket - İngilizce
                      en: Label - English
                    type: text
                    width: 1/2
                  url:
                    label: URL
                    type: url
                  icon_name:
                    label:
                      tr: FontAwesome ikon sınıfı
                      en: FontAwesome icon class
                    type: text
                    placeholder: "fab fa-instagram"
                    width: 1/2
                  icon_svg:
                    label:
                      tr: Özel SVG ikon
                      en: Custom SVG icon
                    type: files
                    max: 1
                    width: 1/2
                    uploads:
                      accept: .svg
                  icon_color:
                    label:
                      tr: İkon rengi
                      en: Icon color
                    type: color
                    width: 1/2
                  icon_size:
                    label:
                      tr: İkon boyutu
                      en: Icon size
                    type: number
                    after: px
                    width: 1/2
                  visible:
                    label:
                      tr: Görünür
                      en: Visible
                    type: toggle
                    default: true

          design_tokens:
            type: fields
            headline:
              tr: Görsel sistem
              en: Visual system
            fields:
              color_background:
                label:
                  tr: Arka plan
                  en: Background
                type: color
                default: "#260c1a"
                width: 1/2
              color_text:
                label:
                  tr: Metin
                  en: Text
                type: color
                default: "#f5e9e2"
                width: 1/2
              color_muted:
                label:
                  tr: Soluk metin
                  en: Muted text
                type: color
                default: "#bca9a8"
                width: 1/2
              color_accent:
                label:
                  tr: Vurgu
                  en: Accent
                type: color
                default: "#c9a45c"
                width: 1/2
              color_accent_secondary:
                label:
                  tr: İkincil vurgu
                  en: Secondary accent
                type: color
                default: "#8f2f4a"
                width: 1/2
              header_style:
                label:
                  tr: Header stili
                  en: Header style
                type: select
                width: 1/2
                options:
                  static: Static
                  sticky: Sticky
              enable_soft_hover:
                label:
                  tr: Yumuşak hover efektleri
                  en: Soft hover effects
                type: toggle
                default: true
                width: 1/2
              site_max_width:
                label:
                  tr: Site maksimum genişliği
                  en: Site max width
                type: text
                placeholder: "1200px"
                width: 1/2
              content_max_width_ch:
                label:
                  tr: Okuma genişliği
                  en: Reading width
                type: number
                after: ch
                default: 68
                width: 1/2
              section_spacing:
                label:
                  tr: Bölüm boşluğu
                  en: Section spacing
                type: text
                placeholder: "4rem"
                width: 1/2
              card_radius:
                label:
                  tr: Kart köşe yarıçapı
                  en: Card radius
                type: number
                after: px
                default: 0
                width: 1/2
              card_border_opacity:
                label:
                  tr: Kart kenarlık opaklığı
                  en: Card border opacity
                type: number
                step: 0.05
                min: 0
                max: 1
                default: 0.1
                width: 1/2

      sidebar:
        width: 1/3
        sections:
          logo_assets:
            type: fields
            headline:
              tr: Logo ve profil
              en: Logo and profile
            fields:
              logo:
                label:
                  tr: Birincil logo
                  en: Primary logo
                type: files
                max: 1
                uploads:
                  accept: .svg, .png, .jpg, .jpeg
                help:
                  tr: Header öncelikle bunu kullanır.
                  en: Header uses this first.
              site_logo:
                label:
                  tr: Uyumluluk logosu
                  en: Compatibility logo
                type: files
                max: 1
                uploads:
                  accept: .svg, .png, .jpg, .jpeg
                help:
                  tr: Eski içerik fallback alanı.
                  en: Legacy fallback field.
              profile_image:
                label:
                  tr: Profil görseli
                  en: Profile image
                type: files
                max: 1
              favicon:
                label: Favicon
                type: files
                max: 1
                uploads:
                  accept: .ico, .png, .svg

          logo_design:
            type: fields
            headline:
              tr: Header logo görünümü
              en: Header logo display
            fields:
              logo_color:
                label:
                  tr: SVG logo rengi
                  en: SVG logo color
                type: color
                default: "#DDD96A"
              logo_size_mobile:
                label:
                  tr: Mobil boyut
                  en: Mobile size
                type: number
                after: px
                default: 48
                width: 1/2
              logo_size_tablet:
                label:
                  tr: Tablet boyut
                  en: Tablet size
                type: number
                after: px
                default: 52
                width: 1/2
              logo_size_desktop:
                label:
                  tr: Masaüstü boyut
                  en: Desktop size
                type: number
                after: px
                default: 56

          footer_fields:
            type: fields
            headline:
              tr: Alt bilgi
              en: Footer
            fields:
              footer_text:
                label:
                  tr: Alt bilgi metni
                  en: Footer text
                type: text
                help:
                  tr: Boş bırakılırsa site alt başlığı kullanılır.
                  en: Falls back to site subtitle when empty.
              footer_text_tr:
                label:
                  tr: Alt bilgi metni - Türkçe
                  en: Footer text - Turkish
                type: text
                width: 1/2
              footer_text_en:
                label:
                  tr: Alt bilgi metni - İngilizce
                  en: Footer text - English
                type: text
                width: 1/2
              copyright_text:
                label:
                  tr: Telif metni ezmesi
                  en: Copyright override
                type: text
              copyright_text_tr:
                label:
                  tr: Telif metni - Türkçe
                  en: Copyright text - Turkish
                type: text
                width: 1/2
              copyright_text_en:
                label:
                  tr: Telif metni - İngilizce
                  en: Copyright text - English
                type: text
                width: 1/2
              rss_enabled:
                label:
                  tr: RSS linkini göster
                  en: Show RSS link
                type: toggle
                default: true

          legacy_identity:
            type: fields
            headline:
              tr: Geriye uyumluluk
              en: Compatibility fallbacks
            fields:
              site_title:
                label:
                  tr: Eski site başlığı
                  en: Legacy site title
                type: text
              site_subtitle:
                label:
                  tr: Eski site alt başlığı
                  en: Legacy site subtitle
                type: text
              site_description:
                label:
                  tr: Eski site açıklaması
                  en: Legacy site description
                type: textarea
                size: small
              site_author:
                label:
                  tr: Eski site yazarı
                  en: Legacy site author
                type: text

  language:
    label:
      tr: Dil
      en: Language
    icon: globe
    columns:
      main:
        width: 2/3
        sections:
          language_settings:
            type: fields
            headline:
              tr: Frontend dili
              en: Frontend language
            fields:
              content_language:
                label:
                  tr: Varsayılan frontend dili
                  en: Default frontend language
                type: select
                default: tr
                width: 1/2
                options:
                  tr: Türkçe
                  en: English
                help:
                  tr: Panel dili kullanıcı hesabından gelir. Frontend ?lang=en veya ?lang=tr ile test edilebilir.
                  en: Panel language comes from the user account. Test frontend via ?lang=en or ?lang=tr.

          translation_overrides:
            type: fields
            headline:
              tr: Metin ezmeleri
              en: Text overrides
            fields:
              site_i18n_overrides:
                label:
                  tr: PO metin ezmeleri
                  en: PO text overrides
                type: structure
                help:
                  tr: site/translations/*.po dosyalarındaki varsayılan frontend metinlerini Panel üzerinden değiştirir.
                  en: Overrides default frontend strings from site/translations/*.po in the Panel.
                columns:
                  key:
                    width: 1/3
                  text_tr:
                    width: 1/3
                  text_en:
                    width: 1/3
                fields:
                  key:
                    label:
                      tr: Anahtar
                      en: Key
                    type: select
                    required: true
                    options:
                      nav.home: nav.home
                      nav.about: nav.about
                      nav.aria.home: nav.aria.home
                      nav.aria.menu: nav.aria.menu
                      footer.rss: footer.rss
                      archive.empty: archive.empty
                      content.type.writing: content.type.writing
                      content.type.essay: content.type.essay
                      content.type.article: content.type.article
                      content.type.note: content.type.note
                      content.type.book: content.type.book
                      content.type.film: content.type.film
                      content.type.playlist: content.type.playlist
                      content.type.photo: content.type.photo
                      content.type.art: content.type.art
                      content.type.catalog: content.type.catalog
                      meta.camera: meta.camera
                      meta.lens: meta.lens
                      meta.film: meta.film
                      meta.track: meta.track
                      meta.genre: meta.genre
                      meta.duration: meta.duration
                      meta.author: meta.author
                      meta.year: meta.year
                      meta.publisher: meta.publisher
                      meta.page: meta.page
                      meta.director: meta.director
                      meta.technique: meta.technique
                      meta.dimensions: meta.dimensions
                      meta.material: meta.material
                      meta.tags: meta.tags
                      playlist.archive: playlist.archive
                      playlist.platform: playlist.platform
                      playlist.track_count: playlist.track_count
                      playlist.listen: playlist.listen
                      cta.read: cta.read
                      cta.review: cta.review
                      cta.listen: cta.listen
                      cta.view: cta.view
                      cta.explore: cta.explore
                      cta.details: cta.details
                      unit.track: unit.track
                      unit.minute.short: unit.minute.short
                      unit.page.short: unit.page.short
                      book.catalog: book.catalog
                      art.archive: art.archive
                      art.production_duration: art.production_duration
                      art.production_year: art.production_year
                      art.material_surface: art.material_surface
                      art.description: art.description
                      art.edition: art.edition
                      art.inventory_code: art.inventory_code
                      art.status: art.status
                      art.status_draft: art.status_draft
                      art.status_completed: art.status_completed
                      art.status_exhibited: art.status_exhibited
                      art.status_archived: art.status_archived
                      art.status_unavailable: art.status_unavailable
                      tags.label: tags.label
                      tags.title: tags.title
                      tags.search: tags.search
                      tags.placeholder: tags.placeholder
                      home.recently_catalogued: home.recently_catalogued
                  text_tr:
                    label:
                      tr: Türkçe
                      en: Turkish
                    type: text
                    width: 1/2
                  text_en:
                    label: English
                    type: text
                    width: 1/2

      sidebar:
        width: 1/3
        sections:
          po_info:
            type: info
            theme: info
            headline:
              tr: Dil mimarisi
              en: Language architecture
            text:
              tr: |
                Varsayılan metinler `site/translations/tr.po` ve `site/translations/en.po` dosyalarından gelir. Bu ekrandaki ezmeler dosya değerlerinden önceliklidir.
              en: |
                Default strings come from `site/translations/tr.po` and `site/translations/en.po`. Overrides here take priority.

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        sections:
          seo_defaults:
            type: fields
            headline:
              tr: Varsayılan metadata
              en: Default metadata
            fields:
              default_seo_title:
                label:
                  tr: Varsayılan SEO başlığı
                  en: Default SEO title
                type: text
              default_seo_title_tr:
                label:
                  tr: Varsayılan SEO başlığı - Türkçe
                  en: Default SEO title - Turkish
                type: text
                width: 1/2
              default_seo_title_en:
                label:
                  tr: Varsayılan SEO başlığı - İngilizce
                  en: Default SEO title - English
                type: text
                width: 1/2
              default_seo_description:
                label:
                  tr: Varsayılan meta açıklaması
                  en: Default meta description
                type: textarea
                size: small
              default_seo_description_tr:
                label:
                  tr: Varsayılan meta açıklaması - Türkçe
                  en: Default meta description - Turkish
                type: textarea
                size: small
                width: 1/2
              default_seo_description_en:
                label:
                  tr: Varsayılan meta açıklaması - İngilizce
                  en: Default meta description - English
                type: textarea
                size: small
                width: 1/2
              default_og_image:
                label:
                  tr: Varsayılan OG görseli
                  en: Default OG image
                type: files
                max: 1
              canonical_base_url:
                label: Canonical base URL
                type: url
                placeholder: "https://example.com"
              twitter_card_type:
                label: Twitter card
                type: select
                default: summary_large_image
                options:
                  summary: Summary
                  summary_large_image: Summary large image

      sidebar:
        width: 1/3
        sections:
          seo_health:
            type: info
            theme: notice
            headline:
              tr: SEO sağlık kontrolü
              en: SEO health
            text: |
              {{ site.panelSeoWarnings }}

  media:
    label:
      tr: Medya
      en: Media
    icon: image
    columns:
      main:
        width: 2/3
        sections:
          imagex_info:
            type: info
            theme: info
            headline: ImageX / WebP
            text:
              tr: |
                JPEG, PNG ve WebP görseller, proje picture bileşeni kullanıldığında ImageX üzerinden işlenir. SVG, GIF ve uzak görseller kendi markup yapısını korur.
              en: |
                JPEG, PNG and WebP assets are processed through ImageX when templates use the project picture component. SVG, GIF and remote images keep their native markup.

          imagex_defaults:
            type: fields
            headline:
              tr: Optimizasyon varsayılanları
              en: Optimization defaults
            fields:
              image_optimization_enabled:
                label:
                  tr: ImageX optimizasyonunu etkinleştir
                  en: Enable ImageX optimization
                type: toggle
                default: true
                width: 1/2
              image_default_loading:
                label:
                  tr: Varsayılan yükleme modu
                  en: Default loading mode
                type: select
                default: lazy
                width: 1/2
                options:
                  lazy: Lazy
                  eager:
                    tr: Eager / öncelikli
                    en: Eager / priority
              image_default_srcset:
                label:
                  tr: Varsayılan srcset profili
                  en: Default srcset profile
                type: select
                default: default
                width: 1/2
                options:
                  default:
                    tr: Varsayılan içerik
                    en: Default content
                  card:
                    tr: Kartlar ve küçük görseller
                    en: Cards and small images
                  wide:
                    tr: Geniş içerik
                    en: Wide content
                  hero:
                    tr: Tam genişlik / hero
                    en: Full width / hero
              image_default_sizes:
                label:
                  tr: Varsayılan sizes niteliği
                  en: Default sizes attribute
                type: text
                width: 1/2
                placeholder: "(min-width: 900px) 800px, 100vw"

      sidebar:
        width: 1/3
        sections:
          media_health:
            type: info
            theme: passive
            headline:
              tr: Medya sağlığı
              en: Media health
            text: |
              {{ site.panelMediaSummary }}

          imagex_profiles:
            type: info
            headline:
              tr: Srcset profilleri
              en: Srcset profiles
            text: |
              card: 320 / 600 / 900px
              default: 360 / 720 / 1080 / 1440px
              wide: 640 / 960 / 1280 / 1920px
              hero: 960 / 1440 / 1920 / 2400px

  operations:
    label:
      tr: Operasyonlar
      en: Operations
    icon: settings
    columns:
      main:
        width: 2/3
        sections:
          tmdb_security:
            type: info
            theme: info
            headline:
              tr: Gizli anahtar politikası
              en: Secret policy
            text:
              tr: |
                TMDB, Spotify ve GA4 gizli değerleri `.env` üzerinden okunur. Secret değerleri Panel içeriğine veya frontend'e yazılmaz.
              en: |
                TMDB, Spotify and GA4 secrets are read from `.env`. Secret values are not stored in Panel content or exposed to the frontend.

          tmdb_config:
            type: fields
            headline: TMDB
            fields:
              tmdb_enabled:
                label:
                  tr: Entegrasyon aktif
                  en: Integration enabled
                type: toggle
                default: true
                width: 1/2
              tmdb_cache_enabled:
                label:
                  tr: Cache aktif
                  en: Cache enabled
                type: toggle
                default: true
                width: 1/2
              tmdb_cache_ttl:
                label: Cache TTL
                type: number
                after: minutes
                placeholder: 10080
                width: 1/2
              tmdb_language:
                label:
                  tr: Dil
                  en: Language
                type: select
                default: tr-TR
                width: 1/2
                options:
                  tr-TR: Türkçe
                  en-US: English
              tmdb_image_size:
                label:
                  tr: Görsel boyutu
                  en: Image size
                type: select
                default: w500
                width: 1/2
                options:
                  w500: Standart
                  original: Original
              tmdb_manual_override_priority:
                label:
                  tr: Manuel alanlar öncelikli
                  en: Manual fields first
                type: toggle
                default: true
                width: 1/2

          spotify_status:
            type: info
            theme: info
            headline:
              tr: Spotify bağlantı durumu
              en: Spotify connection
            text: |
              {{ site.spotifyIntegrationStatus }}
              
              Track listesi JSON içe aktarım akışı ile yönetilir. Secret değerleri .env içinde kalır.

          spotify_config:
            type: fields
            headline: Spotify
            fields:
              spotify_enabled:
                label:
                  tr: Entegrasyon aktif
                  en: Integration enabled
                type: toggle
                default: true
                width: 1/2
              spotify_cache_ttl:
                label: Cache TTL
                type: number
                after: minutes
                default: 360
                width: 1/2
              spotify_market:
                label: Market
                type: text
                default: TR
                maxlength: 2
                width: 1/2
                help:
                  tr: ISO ülke kodu. Örnek TR, US.
                  en: ISO country code. Example TR, US.
              spotify_test_connection_requested:
                label:
                  tr: Bağlantıyı test et
                  en: Test connection
                type: toggle
                default: false
                width: 1/2
                help:
                  tr: Açıp kaydedince token testi yapılır ve tekrar kapanır.
                  en: Turn on and save to run a token test; it resets automatically.
              spotify_last_tested_at:
                label:
                  tr: Son test zamanı
                  en: Last test time
                type: date
                time: true
                disabled: true
                width: 1/2
              spotify_last_error:
                label:
                  tr: Son Spotify hatası
                  en: Last Spotify error
                type: textarea
                size: small
                disabled: true
                width: 1/2

      sidebar:
        width: 1/3
        sections:
          cache_status:
            type: info
            theme: notice
            headline:
              tr: Cache durumu
              en: Cache status
            text: |
              {{ site.panelCacheSummary }}

          cache_tools:
            type: fields
            headline:
              tr: Cache araçları
              en: Cache tools
            fields:
              cache_clear_requested:
                label:
                  tr: Cache'i temizle
                  en: Clear cache
                type: toggle
                default: false
                width: 1/2
                help:
                  tr: Açıp kaydedince Kirby page cache, TMDB/Spotify cache ve site/cache klasörü temizlenir. İşlemden sonra otomatik kapanır.
                  en: Turn on and save to clear Kirby page cache, TMDB/Spotify cache and site/cache. It resets automatically.
              cache_last_cleared_at:
                label:
                  tr: Son temizleme zamanı
                  en: Last clear time
                type: date
                time: true
                disabled: true
              cache_last_clear_status:
                label:
                  tr: Son temizleme sonucu
                  en: Last clear result
                type: textarea
                size: small
                disabled: true

          google_analytics_config:
            type: fields
            headline: Google Analytics
            fields:
              ga_enabled:
                label:
                  tr: GA4 frontend ölçümünü etkinleştir
                  en: Enable GA4 frontend tracking
                type: toggle
                default: false
              ga_force_local:
                label:
                  tr: Local/dev ortamda da çalıştır
                  en: Also run in local/dev
                type: toggle
                default: false
                help:
                  tr: Production dışındaki ortamlarda test gerektiğinde açın.
                  en: Enable only when you need non-production testing.
              ga_measurement_id:
                label: GA4 Measurement ID
                type: text
                placeholder: G-XXXXXXXXXX
              ga_report_url:
                label:
                  tr: Analytics hızlı rapor linki
                  en: Analytics quick report link
                type: url
              ga_consent_mode:
                label:
                  tr: Consent modu
                  en: Consent mode
                type: select
                default: denied
                options:
                  denied:
                    tr: Varsayılan kapalı
                    en: Denied by default
                  granted:
                    tr: Varsayılan açık
                    en: Granted by default
