title:
  tr: Eser görseli
  en: Art image
icon: image

accept:
  type: image

fields:
  content_headline:
    label:
      tr: Görsel bilgisi
      en: Image info
    type: headline
  image_title:
    label:
      tr: Görsel başlığı
      en: Image title
    type: text
    width: 1/2
  alt:
    label:
      tr: Alt metin
      en: Alt text
    type: text
    width: 1/2
  image_caption:
    label:
      tr: Kısa açıklama
      en: Caption
    type: textarea
    size: small
  image_role:
    label:
      tr: Görsel niteliği
      en: Image role
    type: text
    width: 1/2
    placeholder:
      tr: Detay, kurulum, doküman, yakın plan
      en: Detail, installation, document, close-up
  image_date:
    label:
      tr: Görsel tarihi
      en: Image date
    type: date
    width: 1/2
  technical_note:
    label:
      tr: Teknik not
      en: Technical note
    type: text
    width: 1/2
  material_note:
    label:
      tr: Malzeme notu
      en: Material note
    type: text
    width: 1/2

  lightbox_headline:
    label: Lightbox
    type: headline
    numbered: false
  lightbox_enabled:
    label:
      tr: Lightbox'ta göster
      en: Show in lightbox
    type: toggle
    default: true
    width: 1/2
  lightbox_caption:
    label:
      tr: Lightbox açıklaması
      en: Lightbox caption
    type: textarea
    size: small
    help:
      tr: Boşsa kısa açıklama kullanılır.
      en: Falls back to caption when empty.

  optimization_headline:
    label:
      tr: Görsel optimizasyonu
      en: Image optimization
    type: headline
    numbered: false
  image_optimization_enabled:
    extends: fields/image-optimization/image_optimization_enabled
  image_loading:
    extends: fields/image-optimization/image_loading
  image_srcset:
    extends: fields/image-optimization/image_srcset
  image_ratio:
    extends: fields/image-optimization/image_ratio
  image_sizes:
    extends: fields/image-optimization/image_sizes
