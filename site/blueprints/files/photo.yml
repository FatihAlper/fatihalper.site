title:
  tr: Fotoğraf dosyası
  en: Photo file
icon: image

accept:
  type: image

fields:
  content_headline:
    label:
      tr: İçerik bilgisi
      en: Content info
    type: headline
  title:
    label:
      tr: Fotoğraf başlığı
      en: Photo title
    type: text
    width: 1/2
    help:
      tr: Albüm overlay ve lightbox başlığı. Boşsa dosya adı kullanılır.
      en: Album overlay and lightbox title. Falls back to filename.
  alt:
    label:
      tr: Alt metin
      en: Alt text
    type: text
    width: 1/2
  caption:
    label:
      tr: Kısa açıklama
      en: Caption
    type: textarea
    size: small
  visual_descriptors:
    label:
      tr: Görsel not / tanım
      en: Visual note / descriptors
    type: tags
    width: 1/2
  atmosphere:
    label:
      tr: Teknik not
      en: Technical note
    type: text
    width: 1/2
  credit:
    label:
      tr: Kaynak / malzeme notu
      en: Credit / source note
    type: text
    width: 1/2
  series:
    label:
      tr: Seri
      en: Series
    type: text
    width: 1/2
  color_mode:
    label:
      tr: Renk modu
      en: Color mode
    type: select
    width: 1/2
    options:
      color:
        tr: Renkli
        en: Color
      bw:
        tr: Siyah beyaz
        en: Black & white

  lightbox_headline:
    label: Lightbox
    type: headline
    numbered: false
  lightbox_enabled:
    label:
      tr: Lightbox'ta göster
      en: Show in lightbox
    type: toggle
    default: true
    width: 1/2
  lightbox_caption:
    label:
      tr: Lightbox açıklaması
      en: Lightbox caption
    type: textarea
    size: small
    help:
      tr: Boşsa kısa açıklama kullanılır.
      en: Falls back to caption when empty.

  exif_headline:
    label:
      tr: Teknik / EXIF
      en: Technical / EXIF
    type: headline
    numbered: false
  camera:
    label:
      tr: Kamera
      en: Camera
    type: text
    width: 1/2
  lens:
    label:
      tr: Lens
      en: Lens
    type: text
    width: 1/2
  focal_length:
    label:
      tr: Odak uzaklığı
      en: Focal length
    type: text
    placeholder: "180mm"
    width: 1/3
  iso:
    label: ISO
    type: text
    placeholder: "400"
    width: 1/3
  shutter_speed:
    label:
      tr: Enstantane
      en: Shutter speed
    type: text
    placeholder: "1/250"
    width: 1/3
  aperture:
    label:
      tr: Diyafram
      en: Aperture
    type: text
    placeholder: "f/3.5"
    width: 1/3
  photo_date:
    label:
      tr: Fotoğraf tarihi
      en: Photo date
    type: date
    width: 1/3
  location:
    label:
      tr: Konum
      en: Location
    type: text
    width: 1/3

  optimization_headline:
    label:
      tr: Görsel optimizasyonu
      en: Image optimization
    type: headline
    numbered: false
  image_optimization_enabled:
    extends: fields/image-optimization/image_optimization_enabled
  image_loading:
    extends: fields/image-optimization/image_loading
  image_srcset:
    extends: fields/image-optimization/image_srcset
  image_ratio:
    extends: fields/image-optimization/image_ratio
  image_sizes:
    extends: fields/image-optimization/image_sizes

  publishing_headline:
    label:
      tr: Yayın
      en: Publishing
    type: headline
  copyright:
    label:
      tr: Telif
      en: Copyright
    type: text
    width: 1/2
  featured:
    label:
      tr: Öne çıkan fotoğraf
      en: Featured photo
    type: toggle
    default: false
    width: 1/2
