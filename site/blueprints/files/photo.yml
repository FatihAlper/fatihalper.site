title: Fotoğraf dosyası
icon: image

accept:
  type: image

fields:
  content_headline:
    label: İçerik bilgisi
    type: headline
  title:
    label: Fotoğraf başlığı
    type: text
    width: 1/2
    help: Albüm overlay ve lightbox başlığı. Boşsa dosya adı kullanılır.
  alt:
    label: Alt metin
    type: text
    width: 1/2
  caption:
    label: Kısa açıklama
    type: textarea
    size: small
  visual_descriptors:
    label: Görsel not / tanım
    type: tags
    width: 1/2
  atmosphere:
    label: Teknik not
    type: text
    width: 1/2
  credit:
    label: Kaynak / malzeme notu
    type: text
    width: 1/2
  series:
    label: Seri
    type: text
    width: 1/2
  color_mode:
    label: Renk / S&B
    type: select
    width: 1/2
    options:
      color: Renkli
      bw: Siyah beyaz

  lightbox_headline:
    label: Lightbox
    type: headline
    numbered: false
  lightbox_enabled:
    label: Lightbox'ta göster
    type: toggle
    default: true
    width: 1/2
  lightbox_caption:
    label: Lightbox açıklaması
    type: textarea
    size: small
    help: Boşsa kısa açıklama kullanılır.

  exif_headline:
    label: Teknik / EXIF metadata
    type: headline
    numbered: false
  camera:
    label: Kamera
    type: text
    width: 1/2
  lens:
    label: Lens
    type: text
    width: 1/2
  focal_length:
    label: Odak uzaklığı
    type: text
    placeholder: "180mm"
    width: 1/3
  iso:
    label: ISO
    type: text
    placeholder: "400"
    width: 1/3
  shutter_speed:
    label: Enstantane
    type: text
    placeholder: "1/250"
    width: 1/3
  aperture:
    label: Diyafram
    type: text
    placeholder: "f/3.5"
    width: 1/3
  photo_date:
    label: Fotoğraf tarihi
    type: date
    width: 1/3
  location:
    label: Konum
    type: text
    width: 1/3

  optimization_headline:
    label: Görsel optimizasyonu
    type: headline
    numbered: false
  image_optimization_enabled:
    label: ImageX ile optimize et
    type: toggle
    default: true
    width: 1/2
  image_loading:
    label: Yükleme modu
    type: select
    default: default
    width: 1/2
    options:
      default: Site varsayılanı
      lazy: Lazy
      eager: Eager / öncelikli
  image_srcset:
    label: Srcset profili
    type: select
    default: auto
    width: 1/2
    options:
      auto: Automatic
      default: Default content
      card: Cards and thumbnails
      wide: Wide content
      hero: Full width / hero
  image_ratio:
    label: Render oranı
    type: select
    default: auto
    width: 1/2
    options:
      auto: Automatic
      intrinsic: Original ratio
      1/1: Square
      4/3: Landscape 4:3
      3/2: Photo 3:2
      16/9: Wide 16:9
      2/3: Portrait 2:3
      3/4: Portrait 3:4
  image_sizes:
    label: Sizes attribute override
    type: text
    width: 1/1
    placeholder: "(min-width: 900px) 800px, 100vw"

  publishing_headline:
    label: Yayın
    type: headline
  copyright:
    label: Telif
    type: text
    width: 1/2
  featured:
    label: Öne çıkan fotoğraf
    type: toggle
    default: false
    width: 1/2
