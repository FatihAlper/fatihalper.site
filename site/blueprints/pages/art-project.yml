title:
  tr: "{{ page.title }}"
  en: "{{ page.title }}"

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          body:
            extends: fields/editor-body

          curator_note:
            label:
              tr: Küratör notu
              en: Curator note
            type: writer

      gallery:
        type: files
        headline:
          tr: Galeri
          en: Gallery
        template: art-image
        layout: cards
        image:
          ratio: 4/3
          cover: true

      catalog:
        type: fields
        headline:
          tr: Katalog bilgileri
          en: Catalog details
        fields:
          year:
            label:
              tr: Yapım yılı
              en: Production year
            type: number
            width: 1/2

          production_duration:
            label:
              tr: Üretim süresi
              en: Production duration
            type: text
            width: 1/2

          materials:
            label:
              tr: Malzemeler
              en: Materials
            type: text

          technique:
            label:
              tr: Teknik
              en: Technique
            type: text
            width: 1/2

          dimensions:
            label:
              tr: Boyutlar
              en: Dimensions
            type: text
            width: 1/2

          edition:
            label:
              tr: Edisyon
              en: Edition
            type: text
            width: 1/2

          inventory_code:
            label:
              tr: Envanter kodu
              en: Inventory code
            type: text
            width: 1/2

          status:
            label:
              tr: Durum
              en: Status
            type: select
            default: draft
            options:
              draft:
                tr: Taslak
                en: Draft
              completed:
                tr: Tamamlandı
                en: Completed
              exhibited:
                tr: Sergilendi
                en: Exhibited
              archived:
                tr: Arşivlendi
                en: Archived
              unavailable:
                tr: Ulaşılamaz
                en: Unavailable

      seo:
        type: fields
        headline:
          tr: SEO
          en: SEO
        fields:
          seo_title:
            extends: fields/seo-title
          seo_description:
            extends: fields/seo-description
          og_image:
            extends: fields/og-image

  sidebar:
    width: 1/3
    sections:
      sidebar_fields:
        type: fields
        fields:
          cover:
            label:
              tr: Kapak görseli
              en: Cover image
            type: files
            max: 1
            layout: cards
            query: page.images
            template: art-image
            image:
              ratio: 4/3
              cover: true

          date:
            label:
              tr: Tarih
              en: Date
            type: date
            default: today

          tags:
            extends: fields/content-tags

      files:
        type: files
        headline:
          tr: Dosyalar
          en: Files
        template: art-image
