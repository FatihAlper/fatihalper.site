title:
  tr: Exhibit
  en: Art
icon: heart

tabs:
  content:
    label:
      tr: Icerikler
      en: Content
    icon: heart
    sections:
      art:
        type: pages
        headline:
          tr: Exhibit / Sanat kayitlari
          en: Exhibit / Art Projects
        layout: cards
        search: true
        empty:
          tr: Henuz exhibit kaydi yok
          en: No art projects yet
        templates:
          - art-project
        sort: date desc

  settings:
    label:
      tr: Arsiv Ayarlari
      en: Archive Settings
    icon: settings
    fields:
      description:
        label:
          tr: Arsiv aciklamasi
          en: Archive Description
        type: textarea
        size: small

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        fields:
          seo_title:
            extends: fields/seo-title
          seo_description:
            extends: fields/seo-description
          og_image:
            extends: fields/og-image
      files:
        width: 1/3
        sections:
          files:
            type: files
