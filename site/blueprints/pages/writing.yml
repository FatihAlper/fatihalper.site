title:
  tr: "{{ page.title }}"
  en: "{{ page.title }}"

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          subtitle:
            label:
              tr: Alt başlık
              en: Subtitle
            type: text

          summary:
            label:
              tr: Özet
              en: Summary
            type: textarea
            size: small
            maxlength: 320

          body:
            extends: fields/editor-body
            required: true

          quote_highlight:
            label:
              tr: Öne çıkan alıntı
              en: Quote highlight
            type: textarea
            size: small
            help:
              tr: Sayfa detayında ayrı bir blok olarak vurgulanır.
              en: Displayed as a highlighted block on the detail page.

      seo:
        type: fields
        headline:
          tr: SEO
          en: SEO
        fields:
          seo_title:
            extends: fields/seo-title
          seo_description:
            extends: fields/seo-description
          og_image:
            extends: fields/og-image

  sidebar:
    width: 1/3
    sections:
      meta:
        type: fields
        fields:
          writing_type:
            label:
              tr: Yazı türü
              en: Writing type
            type: select
            default: essay
            options:
              essay:
                tr: Deneme
                en: Essay
              article:
                tr: Makale
                en: Article
              note:
                tr: Not
                en: Note

          date:
            label:
              tr: Tarih
              en: Date
            type: date
            required: true
            time: false
            default: today

          cover:
            extends: fields/cover-image

          tags:
            extends: fields/content-tags

      files:
        type: files
        headline:
          tr: Dosyalar
          en: Files
        template: photo
