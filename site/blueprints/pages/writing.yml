title: Yazı
icon: text

tabs:
  content:
    label: İçerik
    icon: text
    columns:
      main:
        width: 2/3
        fields:
          subtitle:
            label: Alt başlık / dek
            type: text
          summary:
            label: Kısa özet
            type: textarea
            size: small
            buttons: false
            maxlength: 320
            placeholder: Bu yazı ne hakkında?
            help: Arşiv listesindeki kartlarda, SEO açıklamalarında ve yazının girişinde spot olarak kullanılır.
          body:
            extends: fields/editor-body
            label: Blok içerik
            required: true
          quote_highlight:
            label: Alıntı vurgusu
            type: textarea
            size: small
            buttons: false

      sidebar:
        width: 1/3
        fields:
          writing_type:
            label: Yazı türü
            type: select
            default: essay
            options:
              essay: Deneme
              article: Makale
              note: Not
          date:
            label: Yayın / katalog tarihi
            type: date
            default: today
            required: true
          cover:
            extends: fields/cover-image
            label: Kapak görseli
            help: Arşiv listesi kartlarında ve yazı başında "Hero" olarak kullanılır.
          tags:
            extends: fields/content-tags

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        sections:
          seo_fields:
            type: fields
            fields:
              seo_title:
                extends: fields/seo-title
              seo_description:
                extends: fields/seo-description
              og_image:
                extends: fields/og-image
      files:
        width: 1/3
        sections:
          files:
            type: files
            headline: Dosyalar
            template: photo
