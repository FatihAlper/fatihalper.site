title:
  tr: Yazi
  en: Writing
icon: text

tabs:
  draft:
    label:
      tr: Taslak / Draft
      en: Draft
    icon: text
    columns:
      main:
        width: 2/3
        sections:
          editorial:
            type: fields
            headline:
              tr: Metin Akisi
              en: Editorial Flow
            fields:
              subtitle:
                label:
                  tr: Alt baslik / dek
                  en: Subtitle / Dek
                type: text
                help:
                  tr: Basligin altinda kisa ritim kurar; bos birakilabilir.
                  en: Optional supporting line below the title.
              summary:
                label:
                  tr: Kisa ozet
                  en: Short Summary
                type: textarea
                size: small
                buttons: false
                maxlength: 320
                placeholder:
                  tr: Bu yazi ne hakkinda?
                  en: What is this piece about?
                help:
                  tr: Arsiv kartlari, SEO aciklamasi ve yazinin giris spotu icin kullanilir.
                  en: Used for archive cards, SEO description, and the story intro.
              body:
                extends: fields/editor-body
                label:
                  tr: Blok icerik
                  en: Body Blocks
                required: true
              quote_highlight:
                label:
                  tr: Alinti vurgusu
                  en: Quote Highlight
                type: textarea
                size: small
                buttons: false
                help:
                  tr: Yazi icinde one cikarilacak kisa pasaj.
                  en: Optional pull quote for emphasis.

      sidebar:
        width: 1/3
        sections:
          publishing:
            type: fields
            headline:
              tr: Yayin Bilgisi
              en: Publishing
            fields:
              writing_type:
                label:
                  tr: Yazi turu
                  en: Writing Type
                type: select
                default: essay
                options:
                  essay:
                    tr: Deneme
                    en: Essay
                  article:
                    tr: Makale
                    en: Article
                  note:
                    tr: Not
                    en: Note
              date:
                label:
                  tr: Yayin / katalog tarihi
                  en: Publish / Catalogue Date
                type: date
                default: today
                required: true
          presentation:
            type: fields
            headline:
              tr: Sunum
              en: Presentation
            fields:
              cover:
                extends: fields/cover-image
                label:
                  tr: Kapak gorseli
                  en: Cover Image
                help:
                  tr: Arsiv kartlarinda ve yazi basinda hero olarak kullanilir.
                  en: Used by archive cards and the article hero.
              tags:
                extends: fields/content-tags

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        sections:
          seo_fields:
            type: fields
            headline:
              tr: Arama ve Paylasim
              en: Search and Sharing
            fields:
              seo_title:
                extends: fields/seo-title
              seo_description:
                extends: fields/seo-description
              og_image:
                extends: fields/og-image
      files:
        width: 1/3
        sections:
          files:
            type: files
            headline:
              tr: Dosyalar
              en: Files
            template: photo
