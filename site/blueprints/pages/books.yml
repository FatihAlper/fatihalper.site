title:
  tr: Kitaplar
  en: Books

tabs:
  content:
    label:
      tr: İçerik
      en: Content
    columns:
      main:
        width: 2/3
        sections:
          entries:
            type: pages
            headline:
              tr: Kitap kayıtları
              en: Book entries
            status: all
            search: true
            limit: 20
            layout: cards
            create: book-review
            templates:
              - book-review
            sort: date desc
            image:
              query: page.cover.toFile
              ratio: 2/3
              cover: true

      sidebar:
        width: 1/3
        sections:
          settings:
            type: fields
            headline:
              tr: Ayarlar
              en: Settings
            fields:
              description:
                label:
                  tr: Arşiv açıklaması
                  en: Archive description
                type: textarea
                size: small

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        sections:
          seo_fields:
            type: fields
            fields:
              seo_title:
                extends: fields/seo-title
              seo_description:
                extends: fields/seo-description
              og_image:
                extends: fields/og-image
      files:
        width: 1/3
        sections:
          files:
            type: files
