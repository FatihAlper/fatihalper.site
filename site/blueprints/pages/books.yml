title:
  tr: Kitaplar
  en: Books
icon: book

tabs:
  content:
    label:
      tr: Icerikler
      en: Content
    icon: book
    sections:
      books:
        type: pages
        headline:
          tr: Marginalia / Kitap kayitlari
          en: Marginalia / Book Notes
        layout: cards
        search: true
        empty:
          tr: Henuz kitap kaydi yok
          en: No book reviews yet
        templates:
          - book-review
        sort: date desc
        image:
          query: page.cover.toFile
          ratio: 2/3
          cover: true

  settings:
    label:
      tr: Arsiv Ayarlari
      en: Archive Settings
    icon: settings
    fields:
      description:
        label:
          tr: Arsiv aciklamasi
          en: Archive Description
        type: textarea
        size: small

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        fields:
          seo_title:
            extends: fields/seo-title
          seo_description:
            extends: fields/seo-description
          og_image:
            extends: fields/og-image
      files:
        width: 1/3
        sections:
          files:
            type: files
