title:
  tr: "{{ page.title }}"
  en: "{{ page.title }}"

columns:
  main:
    width: 2/3
    sections:
      album_fields:
        type: fields
        fields:
          subtitle:
            label:
              tr: Alt başlık
              en: Subtitle
            type: text

          date:
            label:
              tr: Tarih
              en: Date
            type: date
            default: today

          location:
            label:
              tr: Konum
              en: Location
            type: text

          statement:
            label:
              tr: Açıklama
              en: Statement
            type: writer

      gallery:
        type: files
        headline:
          tr: Galeri
          en: Gallery
        template: photo
        layout: cards
        info: "{{ file.camera }} – {{ file.lens }}"
        image:
          ratio: 4/3
          cover: true

      seo:
        type: fields
        headline:
          tr: SEO
          en: SEO
        fields:
          seo_title:
            extends: fields/seo-title
          seo_description:
            extends: fields/seo-description
          og_image:
            extends: fields/og-image

  sidebar:
    width: 1/3
    sections:
      sidebar_fields:
        type: fields
        fields:
          cover:
            extends: fields/cover-image

          tags:
            extends: fields/content-tags

      gear:
        type: fields
        headline:
          tr: Ekipman
          en: Gear
        fields:
          camera:
            label:
              tr: Kamera
              en: Camera
            type: text

          lens:
            label:
              tr: Lens
              en: Lens
            type: text

          film_stock:
            label:
              tr: Film
              en: Film stock
            type: text

      files:
        type: files
        headline:
          tr: Dosyalar
          en: Files
