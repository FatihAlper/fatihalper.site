title:
  tr: "{{ page.book_title }}"
  en: "{{ page.book_title }}"

columns:
  main:
    width: 2/3
    sections:
      review_fields:
        type: fields
        fields:
          book_title:
            label:
              tr: Kitap adı
              en: Book title
            type: text
            required: true

          author:
            label:
              tr: Yazar
              en: Author
            type: text
            required: true

          review_summary:
            label:
              tr: İnceleme özeti
              en: Review summary
            type: textarea
            size: small
            maxlength: 360
            help:
              tr: Kart ve özet alanlarında gösterilir.
              en: Shown on cards and summary areas.

          body:
            extends: fields/editor-body

      details:
        type: fields
        headline:
          tr: Detaylar
          en: Details
        fields:
          original_year:
            label:
              tr: Yayın yılı
              en: Publication year
            type: number
            width: 1/2

          publisher:
            label:
              tr: Yayınevi
              en: Publisher
            type: text
            width: 1/2

          translator:
            label:
              tr: Çevirmen
              en: Translator
            type: text
            width: 1/2

          page_count:
            label:
              tr: Sayfa sayısı
              en: Page count
            type: number
            width: 1/2

          isbn:
            label: ISBN
            type: text

      seo:
        type: fields
        headline:
          tr: SEO
          en: SEO
        fields:
          seo_title:
            extends: fields/seo-title
          seo_description:
            extends: fields/seo-description
          og_image:
            extends: fields/og-image

  sidebar:
    width: 1/3
    sections:
      sidebar_fields:
        type: fields
        fields:
          cover:
            extends: fields/cover-image
            image:
              ratio: 2/3

          rating:
            extends: fields/rating-5

          date:
            label:
              tr: Tarih
              en: Date
            type: date
            default: today

          tags:
            extends: fields/content-tags

      files:
        type: files
        headline:
          tr: Dosyalar
          en: Files
        template: photo
