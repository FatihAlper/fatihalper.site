title: Kitap kaydı
icon: book

tabs:
  content:
    label: İnceleme
    icon: book
    columns:
      main:
        width: 2/3
        fields:
          book_title:
            label: Kitap başlığı
            type: text
            width: 1/2
            help: Boşsa Kirby sayfa başlığı kullanılır.
          author:
            label: Yazar
            type: text
            width: 1/2
            required: true
          review_summary:
            label: Kısa inceleme / özet
            type: textarea
            size: small
            buttons: false
            maxlength: 360
          body:
            extends: fields/editor-body
            label: İnceleme gövdesi
          tags:
            extends: fields/content-tags

      sidebar:
        width: 1/3
        fields:
          date:
            label: Katalog tarihi
            type: date
            default: today
          rating:
            extends: fields/rating-5
            label: Puan
          cover:
            extends: fields/cover-image
            label: Kapak görseli
            image:
              ratio: 2/3
              cover: true

  metadata:
    label: Metadata
    icon: list-bullet
    fields:
      original_year:
        label: İlk yayın yılı
        type: number
        width: 1/4
      publisher:
        label: Yayınevi
        type: text
        width: 1/4
      translator:
        label: Çevirmen
        type: text
        width: 1/4
      page_count:
        label: Sayfa sayısı
        type: number
        width: 1/4
      isbn:
        label: ISBN
        type: text
        width: 1/2

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        sections:
          seo_fields:
            type: fields
            fields:
              seo_title:
                extends: fields/seo-title
              seo_description:
                extends: fields/seo-description
              og_image:
                extends: fields/og-image
      files:
        width: 1/3
        sections:
          files:
            type: files
            headline: Dosyalar
            template: photo
