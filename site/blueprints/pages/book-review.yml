title:
  tr: Kitap kaydi
  en: Book Entry
icon: book

tabs:
  review:
    label:
      tr: Inceleme / Review
      en: Review
    icon: book
    columns:
      main:
        width: 2/3
        sections:
          identity:
            type: fields
            headline:
              tr: Kitap Kimligi
              en: Book Identity
            fields:
              book_title:
                label:
                  tr: Kitap basligi
                  en: Book Title
                type: text
                width: 1/2
                help:
                  tr: Bos kalirsa Kirby sayfa basligi kullanilir.
                  en: Falls back to the Kirby page title when empty.
              author:
                label:
                  tr: Yazar
                  en: Author
                type: text
                width: 1/2
                required: true
          editorial:
            type: fields
            headline:
              tr: Editoryal Not
              en: Editorial Note
            fields:
              review_summary:
                label:
                  tr: Kisa inceleme / ozet
                  en: Short Review / Summary
                type: textarea
                size: small
                buttons: false
                maxlength: 360
                help:
                  tr: Liste karti ve sayfa girisi icin kisa metin.
                  en: Short copy for cards and page intro.
              body:
                extends: fields/editor-body
                label:
                  tr: Inceleme govdesi
                  en: Review Body
              tags:
                extends: fields/content-tags

      sidebar:
        width: 1/3
        sections:
          publishing:
            type: fields
            headline:
              tr: Katalog
              en: Catalogue
            fields:
              date:
                label:
                  tr: Katalog tarihi
                  en: Catalogue Date
                type: date
                default: today
              rating:
                extends: fields/rating-5
                label:
                  tr: Puan
                  en: Rating
              cover:
                extends: fields/cover-image
                label:
                  tr: Kapak gorseli
                  en: Cover Image
                image:
                  ratio: 2/3
                  cover: true

  metadata:
    label:
      tr: Detaylar / Details
      en: Details
    icon: list-bullet
    columns:
      main:
        width: 2/3
        fields:
          original_year:
            label:
              tr: Ilk yayin yili
              en: Original Year
            type: number
            width: 1/4
          publisher:
            label:
              tr: Yayinevi
              en: Publisher
            type: text
            width: 1/4
          translator:
            label:
              tr: Cevirmen
              en: Translator
            type: text
            width: 1/4
          page_count:
            label:
              tr: Sayfa sayisi
              en: Page Count
            type: number
            width: 1/4
          isbn:
            label: ISBN
            type: text
            width: 1/2
      guide:
        width: 1/3
        fields:
          metadata_note:
            label:
              tr: Not
              en: Note
            type: info
            theme: info
            text:
              tr: Bu alanlar frontend kartlarini zenginlestirir; zorunlu degildir. Bilgi yoksa bos birakmak daha temizdir.
              en: These fields enrich the frontend cards; leave unknown values empty.

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        sections:
          seo_fields:
            type: fields
            headline:
              tr: Arama ve Paylasim
              en: Search and Sharing
            fields:
              seo_title:
                extends: fields/seo-title
              seo_description:
                extends: fields/seo-description
              og_image:
                extends: fields/og-image
      files:
        width: 1/3
        sections:
          files:
            type: files
            headline:
              tr: Dosyalar
              en: Files
            template: photo
