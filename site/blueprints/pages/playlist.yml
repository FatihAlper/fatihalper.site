title:
  tr: "{{ page.playlist_title }}"
  en: "{{ page.playlist_title }}"

tabs:

  playlist:
    label: Playlist
    icon: audio
    columns:
      main:
        width: 2/3
        sections:
          playlist_fields:
            type: fields
            fields:
              playlist_title:
                label:
                  tr: Playlist adı
                  en: Playlist title
                type: text

              description:
                label:
                  tr: Açıklama
                  en: Description
                type: textarea
                size: small
                maxlength: 320

              body:
                extends: fields/editor-body

              embed_code:
                label:
                  tr: Embed kodu
                  en: Embed code
                type: textarea
                size: medium
                font: monospace
                buttons: false
                help:
                  tr: Spotify, Apple Music vb. embed HTML kodu.
                  en: Embed HTML from Spotify, Apple Music, etc.

          spotify_fields:
            type: fields
            headline: Spotify
            fields:
              spotify_url:
                label: Spotify URL
                type: url
                placeholder: "https://open.spotify.com/playlist/..."

              spotify_sync_requested:
                label:
                  tr: Playlist'i senkronize et
                  en: Sync playlist
                type: toggle
                default: false
                help:
                  tr: Açıp kaydedince Spotify'dan metadata çekilir.
                  en: Turn on and save to fetch metadata from Spotify.

              spotify_force_refresh:
                label:
                  tr: Cache'i yoksay
                  en: Skip cache
                type: toggle
                default: false
                width: 1/2

          seo:
            type: fields
            headline:
              tr: SEO
              en: SEO
            fields:
              seo_title:
                extends: fields/seo-title
              seo_description:
                extends: fields/seo-description
              og_image:
                extends: fields/og-image

      sidebar:
        width: 1/3
        sections:
          playlist_sidebar:
            type: fields
            fields:
              cover:
                extends: fields/cover-image
                image:
                  ratio: 1/1

              show_cover:
                label:
                  tr: Kapak görseli göster
                  en: Show cover image
                type: toggle
                default: true

              date:
                label:
                  tr: Tarih
                  en: Date
                type: date
                required: true
                default: today

              mood_tags:
                extends: fields/mood-tags

              platform:
                label: Platform
                type: select
                default: spotify
                options:
                  spotify: Spotify
                  apple: Apple Music
                  youtube: YouTube Music
                  tidal: Tidal

              track_count:
                label:
                  tr: Parça sayısı
                  en: Track count
                type: number
                width: 1/2

              duration:
                label:
                  tr: Toplam süre
                  en: Total duration
                type: text
                width: 1/2

          spotify_readonly:
            type: fields
            headline:
              tr: Spotify verileri
              en: Spotify data
            fields:
              playlist_id:
                label: Playlist ID
                type: text
                disabled: true
              last_synced_at:
                label:
                  tr: Son senkronizasyon
                  en: Last synced
                type: date
                time: true
                disabled: true
              cover_url:
                label: Cover URL
                type: url
                disabled: true
              last_error:
                label:
                  tr: Son hata
                  en: Last error
                type: textarea
                size: small
                disabled: true

  tracks:
    label:
      tr: Parçalar
      en: Tracks
    icon: list-bullet
    columns:
      main:
        width: 2/3
        sections:
          tracks_fields:
            type: fields
            fields:
              tracks:
                label:
                  tr: Parça listesi
                  en: Track list
                type: structure
                columns:
                  position:
                    width: 1/12
                  title:
                    width: 4/12
                  artist:
                    width: 3/12
                  album:
                    width: 3/12
                  duration:
                    width: 1/12
                fields:
                  position:
                    label: "#"
                    type: number
                    width: 1/6
                  title:
                    label:
                      tr: Parça
                      en: Title
                    type: text
                    width: 1/3
                  artist:
                    label:
                      tr: Sanatçı
                      en: Artist
                    type: text
                    width: 1/3
                  album:
                    label:
                      tr: Albüm
                      en: Album
                    type: text
                    width: 1/3
                  duration:
                    label:
                      tr: Süre
                      en: Duration
                    type: text
                    width: 1/6
                  duration_ms:
                    label: ms
                    type: number
                    disabled: true
                    width: 1/6

      sidebar:
        width: 1/3
        sections:
          json_import:
            type: fields
            headline:
              tr: JSON import
              en: JSON import
            fields:
              spotify_tracks_json:
                label:
                  tr: JSON veri
                  en: JSON data
                type: textarea
                size: medium
                font: monospace
                buttons: false
                help:
                  tr: Spotify API'den alınan JSON track listesini buraya yapıştırın.
                  en: Paste the Spotify API JSON track list here.

              spotify_json_import_requested:
                label:
                  tr: JSON'u içe aktar
                  en: Import JSON
                type: toggle
                default: false
                help:
                  tr: Açıp kaydedince JSON verisi parça listesine dönüştürülür.
                  en: Turn on and save to convert JSON data to the track list.

          skip_notes:
            type: fields
            fields:
              skip_notes:
                label:
                  tr: Atlanan parçalar
                  en: Skipped tracks
                type: textarea
                size: small
                disabled: true
