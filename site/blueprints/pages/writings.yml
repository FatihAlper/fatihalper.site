title:
  tr: Yazilar
  en: Writings
icon: edit

tabs:
  content:
    label:
      tr: Icerikler
      en: Content
    icon: document
    sections:
      writings:
        type: pages
        headline:
          tr: Fragmanlar / Yazilar
          en: Fragments / Writings
        layout: table
        search: true
        empty:
          tr: Henuz yazi yok
          en: No writing entries yet
        templates:
          - writing
        sort: date desc
        columns:
          title:
            label:
              tr: Baslik
              en: Title
          date:
            label:
              tr: Tarih
              en: Date
            display: d.m.Y
          writing_type:
            label:
              tr: Tur
              en: Type
          status:
            label:
              tr: Durum
              en: Status

  settings:
    label:
      tr: Arsiv Ayarlari
      en: Archive Settings
    icon: settings
    fields:
      description:
        label:
          tr: Arsiv aciklamasi
          en: Archive Description
        type: textarea
        size: small
        help:
          tr: Arsiv basliginda ve ana sayfa oda fallback'inde kullanilir.
          en: Rendered in the archive header and the default home rooms fallback.

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        fields:
          seo_title:
            extends: fields/seo-title
          seo_description:
            extends: fields/seo-description
          og_image:
            extends: fields/og-image
      files:
        width: 1/3
        sections:
          files:
            type: files
