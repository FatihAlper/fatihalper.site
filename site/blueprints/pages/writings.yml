title:
  tr: Yazılar
  en: Writings

tabs:
  content:
    label:
      tr: İçerik
      en: Content
    columns:
      main:
        width: 2/3
        sections:
          entries:
            type: pages
            headline:
              tr: Yazı kayıtları
              en: Writing entries
            status: all
            search: true
            limit: 20
            layout: table
            create: writing
            templates:
              - writing
            sort: date desc
            columns:
              title:
                label:
                  tr: Başlık
                  en: Title
              writing_type:
                label:
                  tr: Tür
                  en: Type
              date:
                label:
                  tr: Tarih
                  en: Date
                display: d.m.Y
              status:
                label:
                  tr: Durum
                  en: Status

      sidebar:
        width: 1/3
        sections:
          settings:
            type: fields
            headline:
              tr: Ayarlar
              en: Settings
            fields:
              description:
                label:
                  tr: Arşiv açıklaması
                  en: Archive description
                type: textarea
                size: small

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        sections:
          seo_fields:
            type: fields
            fields:
              seo_title:
                extends: fields/seo-title
              seo_description:
                extends: fields/seo-description
              og_image:
                extends: fields/og-image
      files:
        width: 1/3
        sections:
          files:
            type: files
