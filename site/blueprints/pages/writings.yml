title: Writings
icon: edit

tabs:
  content:
    label: Content
    icon: document
    sections:
      writings:
        type: pages
        headline: Writings
        layout: table
        search: true
        empty: No writing entries yet
        templates:
          - writing
        sort: date desc
        columns:
          title:
            label: Title
          date:
            label: Date
            display: d.m.Y
          writing_type:
            label: Type
          status:
            label: Status

  settings:
    label: Archive Settings
    icon: settings
    fields:
      description:
        label: Archive description
        type: textarea
        size: small
        help: Rendered in the archive header and the default home rooms fallback.

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        fields:
          seo_title:
            label: SEO title
            type: text
          seo_description:
            label: SEO description
            type: textarea
            size: small
          og_image:
            label: OG image
            type: files
            max: 1
      files:
        width: 1/3
        sections:
          files:
            type: files
