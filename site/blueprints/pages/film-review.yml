title:
  tr: "{{ page.film_title }}"
  en: "{{ page.film_title }}"

tabs:

  film:
    label:
      tr: Film
      en: Film
    icon: video
    columns:
      main:
        width: 2/3
        sections:
          film_fields:
            type: fields
            fields:
              film_title:
                label:
                  tr: Film adı
                  en: Film title
                type: text
                required: true

              original_title:
                label:
                  tr: Orijinal adı
                  en: Original title
                type: text

              tmdb_id:
                label: TMDB ID
                type: text
                width: 1/2
                help:
                  tr: TMDB film ID'si girildiğinde metadata otomatik çekilebilir.
                  en: Entering a TMDB ID allows automatic metadata fetching.

              director:
                label:
                  tr: Yönetmen
                  en: Director
                type: text

              release_year:
                label:
                  tr: Yapım yılı
                  en: Release year
                type: number
                width: 1/2

              runtime:
                label:
                  tr: Süre
                  en: Runtime
                type: number
                after: dk
                width: 1/2

              countries:
                label:
                  tr: Ülkeler
                  en: Countries
                type: text

              genres:
                label:
                  tr: Türler
                  en: Genres
                type: text

      sidebar:
        width: 1/3
        sections:
          film_sidebar:
            type: fields
            fields:
              poster:
                label:
                  tr: Poster
                  en: Poster
                type: files
                max: 1
                layout: cards
                query: page.images
                uploads: true
                image:
                  ratio: 2/3
                  cover: true

              backdrop:
                label:
                  tr: Arka plan
                  en: Backdrop
                type: files
                max: 1
                layout: cards
                query: page.images
                uploads: true
                image:
                  ratio: 16/9
                  cover: true

              rating:
                extends: fields/rating-5

              date:
                label:
                  tr: Tarih
                  en: Date
                type: date
                required: true
                default: today

  review:
    label:
      tr: İnceleme
      en: Review
    icon: text
    columns:
      main:
        width: 2/3
        sections:
          review_fields:
            type: fields
            fields:
              short_review:
                label:
                  tr: Kısa inceleme
                  en: Short review
                type: textarea
                size: small
                maxlength: 360
                help:
                  tr: Kart görünümünde ve özet alanlarında gösterilir.
                  en: Shown on cards and summary areas.

              body:
                extends: fields/editor-body

          seo:
            type: fields
            headline:
              tr: SEO
              en: SEO
            fields:
              seo_title:
                extends: fields/seo-title
              seo_description:
                extends: fields/seo-description
              og_image:
                extends: fields/og-image

      sidebar:
        width: 1/3
        sections:
          review_sidebar:
            type: fields
            fields:
              tags:
                extends: fields/content-tags

          files:
            type: files
            headline:
              tr: Dosyalar
              en: Files
            template: photo
