title:
  tr: Kadraj
  en: Photography
icon: image

tabs:
  content:
    label:
      tr: Icerikler
      en: Content
    icon: image
    sections:
      photography:
        type: pages
        headline:
          tr: Kadraj / Fotograf albumleri
          en: Frame / Photo Albums
        layout: cards
        search: true
        empty:
          tr: Henuz fotograf albumu yok
          en: No photo albums yet
        templates:
          - photo-album
        sort: date desc
        image:
          query: page.cover.toFile
          ratio: 4/3
          cover: true

  settings:
    label:
      tr: Arsiv Ayarlari
      en: Archive Settings
    icon: settings
    fields:
      description:
        label:
          tr: Arsiv aciklamasi
          en: Archive Description
        type: textarea
        size: small

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        fields:
          seo_title:
            extends: fields/seo-title
          seo_description:
            extends: fields/seo-description
          og_image:
            extends: fields/og-image
      files:
        width: 1/3
        sections:
          files:
            type: files
