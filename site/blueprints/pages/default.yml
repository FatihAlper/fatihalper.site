title:
  tr: "{{ page.title }}"
  en: "{{ page.title }}"

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          text:
            label:
              tr: İçerik
              en: Content
            type: textarea
            size: huge

      seo:
        type: fields
        headline:
          tr: SEO
          en: SEO
        fields:
          seo_title:
            extends: fields/seo-title
          seo_description:
            extends: fields/seo-description
          og_image:
            extends: fields/og-image

  sidebar:
    width: 1/3
    sections:
      pages:
        type: pages
        headline:
          tr: Alt sayfalar
          en: Subpages
      files:
        type: files
        headline:
          tr: Dosyalar
          en: Files
