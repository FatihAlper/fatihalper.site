title:
  tr: Playlistler
  en: Playlists
icon: audio

tabs:
  content:
    label:
      tr: Icerikler
      en: Content
    icon: audio
    sections:
      playlists:
        type: pages
        headline:
          tr: Rezonans / Playlistler
          en: Resonance / Playlists
        layout: cards
        search: true
        empty:
          tr: Henuz playlist yok
          en: No playlists yet
        templates:
          - playlist
        sort: date desc

  settings:
    label:
      tr: Arsiv Ayarlari
      en: Archive Settings
    icon: settings
    fields:
      description:
        label:
          tr: Arsiv aciklamasi
          en: Archive Description
        type: textarea
        size: small

  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        fields:
          seo_title:
            extends: fields/seo-title
          seo_description:
            extends: fields/seo-description
          og_image:
            extends: fields/og-image
      files:
        width: 1/3
        sections:
          files:
            type: files
