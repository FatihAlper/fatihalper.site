title:
  tr: Yönetici
  en: Administrator

description:
  tr: Site, içerik ve entegrasyon ayarlarına tam erişim.
  en: Full access to site, content and integration settings.

home: /panel/site

buttons:
  settings: true

image:
  cover: true
  back: black

tabs:
  profile:
    label:
      tr: Profil
      en: Profile
    icon: user
    columns:
      main:
        width: 2/3
        sections:
          identity:
            type: fields
            fields:
              public_name:
                label:
                  tr: Görünen ad
                  en: Display name
                type: text

              role_title:
                label:
                  tr: Rol / ünvan
                  en: Role / title
                type: text

              short_bio:
                label:
                  tr: Kısa biyografi
                  en: Short bio
                type: textarea
                size: small
                maxlength: 240

              bio:
                label:
                  tr: Uzun biyografi
                  en: Long bio
                type: textarea
                size: huge

      sidebar:
        width: 1/3
        sections:
          admin_note:
            type: info
            theme: info
            headline:
              tr: Hesap bilgisi
              en: Account info
            text:
              tr: E-posta, parola, avatar ve Panel dili üstteki ayarlar butonundan yönetilir. Bu alanlar Kirby native multi-language ile dil bazında saklanır.
              en: Email, password, avatar and Panel language are managed from the settings button above. These fields are stored per-language via Kirby native multi-language.
          profile_media:
            type: files
            headline:
              tr: Profil dosyaları
              en: Profile files
            layout: cards
            image:
              cover: true
            empty:
              tr: Henüz profil dosyası yok.
              en: No profile files yet.

  contact:
    label:
      tr: İletişim
      en: Contact
    icon: email
    columns:
      main:
        width: 2/3
        sections:
          contact_fields:
            type: fields
            fields:
              public_email:
                label:
                  tr: Yayınlanabilir e-posta
                  en: Public email
                type: email
                width: 1/2
                help:
                  tr: Site üzerinde gösterilebilecek e-posta adresi.
                  en: Email address that can be shown on the site.
              website:
                label:
                  tr: Web sitesi
                  en: Website
                type: url
                width: 1/2
              location:
                label:
                  tr: Konum
                  en: Location
                type: text
              social_links:
                label:
                  tr: Sosyal / profesyonel linkler
                  en: Social / professional links
                type: structure
                columns:
                  platform:
                    width: 1/3
                  label:
                    width: 1/3
                  visible:
                    width: 1/3
                fields:
                  platform:
                    label: Platform
                    type: text
                    width: 1/2
                  url:
                    label: URL
                    type: url
                    width: 1/2
                  label:
                    label:
                      tr: Etiket
                      en: Label
                    type: text
                  visible:
                    label:
                      tr: Görünür
                      en: Visible
                    type: toggle
                    default: true

      sidebar:
        width: 1/3
        sections:
          contact_note:
            type: info
            theme: info
            headline:
              tr: Gizlilik notu
              en: Privacy note
            text:
              tr: Buradaki alanlar içerik verisi olarak saklanır. Parola veya API anahtarı eklemeyin.
              en: These fields are stored as content data. Do not add passwords or API keys.

  preferences:
    label:
      tr: Tercihler
      en: Preferences
    icon: settings
    columns:
      main:
        width: 2/3
        sections:
          editorial_preferences:
            type: fields
            fields:
              timezone:
                label:
                  tr: Zaman dilimi
                  en: Timezone
                type: select
                default: Europe/Istanbul
                width: 1/2
                options:
                  Europe/Istanbul: Europe/Istanbul
                  UTC: UTC
              editorial_signature:
                label:
                  tr: Editoryal imza
                  en: Editorial signature
                type: text
              internal_notes:
                label:
                  tr: İç notlar
                  en: Internal notes
                type: textarea
                size: small
                buttons: false
                help:
                  tr: Sadece Panel içi yönetim notları için kullanın.
                  en: Use only for internal Panel management notes.

      sidebar:
        width: 1/3
        sections:
          panel_language_note:
            type: info
            theme: info
            headline:
              tr: Dil bilgisi
              en: Language info
            text:
              tr: Kirby native multi-language etkin. İçerik panelde dil seçici ile yönetilir.
              en: Kirby native multi-language is active. Content is managed via the language switcher in the Panel.

          access_summary:
            type: info
            theme: positive
            headline:
              tr: Yetki özeti
              en: Access summary
            text:
              tr: Admin rolü Kirby'de zorunludur ve tüm izinlere sahiptir.
              en: The admin role is mandatory in Kirby and always has all permissions.
