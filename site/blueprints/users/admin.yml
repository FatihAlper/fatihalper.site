title:
  tr: Yönetici
  en: Administrator

description:
  tr: Site, içerik, çeviri ve entegrasyon ayarlarına tam erişim.
  en: Full access to site, content, translation and integration settings.

home: /panel/site

buttons:
  settings: true

image:
  cover: true
  back: black

tabs:
  profile:
    label:
      tr: Profil
      en: Profile
    icon: user
    columns:
      main:
        width: 2/3
        sections:
          identity:
            type: fields
            fields:
              public_name_tr:
                label:
                  tr: Görünen ad - Türkçe
                  en: Display name - Turkish
                type: text
                width: 1/2
              public_name_en:
                label:
                  tr: Görünen ad - İngilizce
                  en: Display name - English
                type: text
                width: 1/2
              role_title_tr:
                label:
                  tr: Rol/ünvan - Türkçe
                  en: Role/title - Turkish
                type: text
                width: 1/2
              role_title_en:
                label:
                  tr: Rol/ünvan - İngilizce
                  en: Role/title - English
                type: text
                width: 1/2
              short_bio_tr:
                label:
                  tr: Kısa biyografi - Türkçe
                  en: Short bio - Turkish
                type: textarea
                size: small
                maxlength: 240
                width: 1/2
              short_bio_en:
                label:
                  tr: Kısa biyografi - İngilizce
                  en: Short bio - English
                type: textarea
                size: small
                maxlength: 240
                width: 1/2
              bio_tr:
                label:
                  tr: Uzun biyografi - Türkçe
                  en: Long bio - Turkish
                type: blocks
                fieldsets:
                  - heading
                  - text
                  - quote
                  - list
              bio_en:
                label:
                  tr: Uzun biyografi - İngilizce
                  en: Long bio - English
                type: blocks
                fieldsets:
                  - heading
                  - text
                  - quote
                  - list

      sidebar:
        width: 1/3
        sections:
          admin_note:
            type: info
            theme: info
            headline:
              tr: Hesap bilgisi
              en: Account info
            text:
              tr: E-posta, parola, avatar ve Panel dili üstteki ayarlar butonundan yönetilir. Bu alanlar sitenin iki dilli profil ve editoryal imza verileri içindir.
              en: Email, password, avatar and Panel language are managed from the settings button above. These fields are for bilingual profile and editorial signature data.
          profile_media:
            type: files
            headline:
              tr: Profil dosyaları
              en: Profile files
            layout: cards
            image:
              cover: true
            empty:
              tr: Henüz profil dosyası yok.
              en: No profile files yet.

  contact:
    label:
      tr: İletişim
      en: Contact
    icon: email
    columns:
      main:
        width: 2/3
        sections:
          contact_fields:
            type: fields
            fields:
              public_email:
                label:
                  tr: Yayınlanabilir e-posta
                  en: Public email
                type: email
                width: 1/2
                help:
                  tr: Site üzerinde gösterilebilecek e-posta adresi. Giriş e-postasından ayrı tutulabilir.
                  en: Email address that can be shown on the site. It can differ from the login email.
              website:
                label:
                  tr: Web sitesi
                  en: Website
                type: url
                width: 1/2
              location_tr:
                label:
                  tr: Konum - Türkçe
                  en: Location - Turkish
                type: text
                width: 1/2
              location_en:
                label:
                  tr: Konum - İngilizce
                  en: Location - English
                type: text
                width: 1/2
              social_links:
                label:
                  tr: Sosyal/profesyonel linkler
                  en: Social/professional links
                type: structure
                columns:
                  platform:
                    width: 1/4
                  label_tr:
                    width: 1/4
                  label_en:
                    width: 1/4
                  visible:
                    width: 1/4
                fields:
                  platform:
                    label:
                      tr: Platform
                      en: Platform
                    type: text
                    width: 1/2
                  url:
                    label: URL
                    type: url
                    width: 1/2
                  label_tr:
                    label:
                      tr: Etiket - Türkçe
                      en: Label - Turkish
                    type: text
                    width: 1/2
                  label_en:
                    label:
                      tr: Etiket - İngilizce
                      en: Label - English
                    type: text
                    width: 1/2
                  visible:
                    label:
                      tr: Görünür
                      en: Visible
                    type: toggle
                    default: true

      sidebar:
        width: 1/3
        sections:
          contact_note:
            type: info
            theme: info
            headline:
              tr: Gizlilik notu
              en: Privacy note
            text:
              tr: Buradaki alanlar içerik verisi olarak saklanır. Parola, API anahtarı, özel token veya kişisel hassas veri eklemeyin.
              en: These fields are stored as content data. Do not add passwords, API keys, private tokens or sensitive personal data.

  preferences:
    label:
      tr: Tercihler
      en: Preferences
    icon: settings
    columns:
      main:
        width: 2/3
        sections:
          editorial_preferences:
            type: fields
            fields:
              preferred_content_language:
                label:
                  tr: Varsayılan içerik dili
                  en: Default content language
                type: select
                default: tr
                width: 1/2
                options:
                  tr: Türkçe
                  en: English
              timezone:
                label:
                  tr: Zaman dilimi
                  en: Timezone
                type: select
                default: Europe/Istanbul
                width: 1/2
                options:
                  Europe/Istanbul: Europe/Istanbul
                  UTC: UTC
              editorial_signature_tr:
                label:
                  tr: Editoryal imza - Türkçe
                  en: Editorial signature - Turkish
                type: text
                width: 1/2
              editorial_signature_en:
                label:
                  tr: Editoryal imza - İngilizce
                  en: Editorial signature - English
                type: text
                width: 1/2
              internal_notes:
                label:
                  tr: İç notlar
                  en: Internal notes
                type: textarea
                size: small
                buttons: false
                help:
                  tr: Sadece Panel içi yönetim notları için kullanın.
                  en: Use only for internal Panel management notes.

      sidebar:
        width: 1/3
        sections:
          panel_language_note:
            type: info
            theme: info
            headline:
              tr: Panel dili
              en: Panel language
            text:
              tr: Panel dili frontend TR/EN switch'ten bağımsızdır. Bu hesabın Panel dilini değiştirmek için üstteki ayarlar butonundan Dil seçeneğini kullanın. Yeni/boş kullanıcılar için varsayılan Panel dili site/config/config.php içindeki panel.language ayarından gelir.
              en: The Panel language is independent from the frontend TR/EN switch. Use the settings button above and choose Language to change this account's Panel language. For new/empty users, the default Panel language comes from panel.language in site/config/config.php.

          access_summary:
            type: info
            theme: positive
            headline:
              tr: Yetki özeti
              en: Access summary
            text:
              tr: Admin rolü Kirby'de zorunludur ve tüm izinlere sahiptir. Bu blueprint yalnızca ek alanları ve hesap düzenini tanımlar.
              en: The admin role is mandatory in Kirby and always has all permissions. This blueprint only defines extra fields and the account layout.
